<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>CREATIVE MODE Review Panel Test v2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#2f2a21;--line:#b99558;--ok:#238b57;--note:#8a6b31;--toolbar-h:calc(86px + env(safe-area-inset-bottom))}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#24170d;color:var(--ink)}button,textarea{font:inherit}.app{position:fixed;inset:0;overflow:hidden}.map{position:absolute;inset:0 0 var(--toolbar-h)}.leaflet-control-zoom{display:none!important}.leaflet-control-attribution{font-size:8px!important}
.float{position:absolute;z-index:800;border:1.5px solid rgba(126,85,20,.62);background:rgba(255,252,242,.96);box-shadow:0 5px 16px rgba(55,34,9,.18);color:#34291c;font-weight:900}.back{top:max(14px,env(safe-area-inset-top));left:14px;height:54px;padding:0 18px;border-radius:17px;font-size:17px}.review-launcher{top:max(14px,env(safe-area-inset-top));right:14px;width:58px;height:58px;border-radius:18px;font-size:24px}.count{position:absolute;right:-5px;top:-7px;min-width:23px;height:23px;padding:0 6px;border-radius:99px;background:#7b5b24;color:#fff;border:2px solid #fff;font-size:12px;display:grid;place-items:center}.save{left:14px;bottom:calc(var(--toolbar-h) + 14px);height:56px;padding:0 16px;border-radius:17px;color:#0b70c8;font-size:17px}.toolbox{right:14px;bottom:calc(var(--toolbar-h) + 14px);width:58px;height:58px;border-radius:17px;font-size:25px}.bottom-toolbar{position:absolute;z-index:790;left:0;right:0;bottom:0;height:var(--toolbar-h);background:rgba(59,49,37,.96);box-shadow:0 -8px 24px rgba(40,31,20,.16)}.current{left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);height:60px;min-width:128px;padding:0 20px;border-radius:18px;font-size:16px;z-index:810}
.note-dot{width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--note);background:#fffaf0;display:grid;place-items:center;font-size:12px}.note-dot.done{box-shadow:0 0 0 2px var(--ok);background:#e9fff1;color:var(--ok)}
.sheet-backdrop{position:absolute;z-index:900;inset:0;background:rgba(23,17,10,.34);opacity:0;pointer-events:none;transition:opacity .2s}.sheet-backdrop.open{opacity:1;pointer-events:auto}.sheet{position:absolute;z-index:910;left:0;right:0;top:0;height:min(72vh,650px);border-radius:0 0 28px 28px;background:rgba(255,252,245,.985);box-shadow:0 20px 42px rgba(0,0,0,.32);transform:translateY(calc(-100% - 8px));transition:transform .38s cubic-bezier(.22,.8,.22,1);display:flex;flex-direction:column;overflow:hidden;will-change:transform}.sheet.open{transform:translateY(0)}.sheet.dragging{transition:none}.sheet-top{height:calc(max(10px,env(safe-area-inset-top)) + 8px);flex:0 0 auto}.sheet-head{padding:0 14px 10px}.sheet-head h2{margin:0;font-size:18px}.sheet-head small{font-size:12px;color:#746957}.sheet-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;padding:0 14px 14px;touch-action:pan-y}.spot-list{display:grid;gap:9px}.spot-card{width:100%;text-align:left;border:1px solid #ddd2c0;border-radius:15px;padding:12px;background:#fff;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}.dist{min-width:48px;padding:6px 8px;border-radius:10px;background:#efe3c6;color:#6b5321;font-weight:900;text-align:center}.spot-name{font-weight:900;color:#2f85df;font-size:16px}.spot-sub{display:block;font-size:12px;color:#6f6659;margin-top:3px}.status{font-size:12px;font-weight:900;color:#3567a3}.detail{display:none}.detail.open{display:block}.reason-title{font-weight:900;margin:8px 0 10px}.choices{display:grid;gap:8px}.choice{width:100%;text-align:left;border:1px solid #d8cfbf;border-radius:12px;background:#fff;padding:11px 12px;font-weight:800}.choice.selected{border-color:#58ad79;background:#edfff3;color:#176f42}.comment{width:100%;min-height:100px;margin-top:12px;padding:11px;border:1px solid #d8cfbf;border-radius:12px}.save-detail{width:100%;min-height:50px;border:0;border-radius:13px;background:var(--ok);color:#fff;font-weight:900;margin-top:12px}
.drag-zone{flex:0 0 auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom));touch-action:none;user-select:none;-webkit-user-select:none;border-top:1px solid rgba(185,149,88,.25);background:#fffaf2}.drag-copy{text-align:center;font-size:12px;font-weight:900;color:#756a5c;margin-bottom:8px}.grabber{width:58px;height:6px;border-radius:99px;background:#aaa196;margin:0 auto}.test-badge{position:absolute;z-index:780;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);padding:5px 9px;border-radius:99px;background:rgba(55,39,23,.88);color:#fff;font-size:10px;font-weight:900}
</style></head>
<body><div class="app"><div id="map" class="map"></div><div class="test-badge">BRANCH TEST v2</div><button id="back" class="float back">← 戻る</button><button id="reviewLauncher" class="float review-launcher" aria-label="補足情報">📝<span id="reviewCount" class="count">3</span></button><button id="save" class="float save">💾 保存</button><button class="float toolbox">🧰</button><div class="bottom-toolbar"></div><button id="current" class="float current">◎ 現在地</button><div id="backdrop" class="sheet-backdrop"></div><section id="sheet" class="sheet"><div class="sheet-top"></div><div class="sheet-head"><h2 id="sheetTitle">補足情報（3件）</h2><small>50m未満の追加POIに説明を添えます</small></div><div id="sheetScroll" class="sheet-scroll"><div id="list" class="spot-list"></div><div id="detail" class="detail"></div></div><div id="dragZone" class="drag-zone" aria-label="上へスワイプして戻す"><div class="drag-copy">ここを上へスワイプして戻す</div><div class="grabber"></div></div></section></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map',{zoomControl:false}).setView([35.6433,139.8608],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const spots=[{id:1,name:'芝生広場 北側',lat:35.6444,lng:139.8600,dist:43,done:false,reasons:[],comment:''},{id:2,name:'水辺デッキ付近',lat:35.6429,lng:139.8621,dist:47,done:false,reasons:[],comment:''},{id:3,name:'公園入口付近',lat:35.6419,lng:139.8591,dist:38,done:false,reasons:[],comment:''}];
spots.forEach(s=>{L.circle([s.lat,s.lng],{radius:50,color:'#b48716',weight:2,opacity:.78,fillOpacity:.03,dashArray:'6 5'}).addTo(map);const icon=L.divIcon({className:'',html:`<div id="mk-${s.id}" class="note-dot">📝</div>`,iconSize:[24,24],iconAnchor:[12,12]});L.marker([s.lat,s.lng],{icon}).addTo(map)});[[35.6452,139.8593],[35.6439,139.8614],[35.6424,139.8607],[35.6415,139.8617]].forEach(p=>L.circleMarker(p,{radius:7,color:'#fff',weight:3,fillColor:'#1687e8',fillOpacity:1}).addTo(map));
const $=id=>document.getElementById(id),sheet=$('sheet'),backdrop=$('backdrop'),list=$('list'),detail=$('detail'),sheetScroll=$('sheetScroll'),dragZone=$('dragZone');
function sync(){const n=spots.filter(s=>!s.done).length;$('reviewCount').textContent=n;$('sheetTitle').textContent=`補足情報（${n}件）`;renderList()}
function openSheet(){detail.classList.remove('open');list.style.display='grid';sheetScroll.scrollTop=0;sheet.style.transform='';sheet.classList.add('open');backdrop.classList.add('open')}
function renderList(){list.innerHTML=spots.map(s=>`<button class="spot-card" data-id="${s.id}"><span class="dist">${s.dist}m</span><span><span class="spot-name">${s.name}</span><span class="spot-sub">他のスポットまで ${s.dist}m</span></span><span class="status">${s.done?'入力済':'入力する'} ›</span></button>`).join('');list.querySelectorAll('.spot-card').forEach(b=>b.onclick=()=>openDetail(+b.dataset.id))}
const reasons=['十分な滞留スペースがある','動線が分離されている','一般利用者への影響が小さい','景観・地域特有の魅力がある','季節や時間で魅力が変わる','その他'];
function openDetail(id){const s=spots.find(x=>x.id===id);list.style.display='none';detail.classList.add('open');sheetScroll.scrollTop=0;detail.innerHTML=`<strong>${s.name}</strong><span class="spot-sub">他のスポットまで ${s.dist}m</span><div class="reason-title">なぜ50m未満でも候補にしましたか？</div><div class="choices">${reasons.map(r=>`<button class="choice" data-r="${r}">${r}</button>`).join('')}</div><textarea class="comment" placeholder="補足コメント（任意）"></textarea><button class="save-detail">保存する</button>`;detail.querySelectorAll('.choice').forEach(b=>b.onclick=()=>b.classList.toggle('selected'));detail.querySelector('.save-detail').onclick=()=>{s.done=true;sync();list.style.display='grid';detail.classList.remove('open');sheetScroll.scrollTop=0}}
let sy=0,dy=0,dragging=false;function start(y){dragging=true;sy=y;dy=0;sheet.classList.add('dragging')}function move(y){if(!dragging)return;dy=Math.min(0,y-sy);sheet.style.transform=`translateY(${dy}px)`}function end(){if(!dragging)return;dragging=false;const close=Math.abs(dy)>100;sheet.classList.remove('dragging');sheet.style.transition='transform .38s cubic-bezier(.22,.8,.22,1)';sheet.style.transform=close?'translateY(calc(-100% - 8px))':'translateY(0)';if(close)backdrop.classList.remove('open');setTimeout(()=>{if(close)sheet.classList.remove('open');sheet.style.transform='';sheet.style.transition=''},390)}
dragZone.addEventListener('touchstart',e=>{if(e.touches.length===1)start(e.touches[0].clientY)},{passive:true});dragZone.addEventListener('touchmove',e=>{if(!dragging)return;e.preventDefault();move(e.touches[0].clientY)},{passive:false});dragZone.addEventListener('touchend',end,{passive:true});dragZone.addEventListener('touchcancel',end,{passive:true});
$('reviewLauncher').onclick=openSheet;$('current').onclick=()=>map.flyTo([35.6433,139.8608],16,{duration:.5});$('back').onclick=()=>history.length>1?history.back():location.href='lab.html';$('save').onclick=()=>{$('save').textContent='✓ 保存済';setTimeout(()=>$('save').textContent='💾 保存',1200)};sync();
</script></body></html>
