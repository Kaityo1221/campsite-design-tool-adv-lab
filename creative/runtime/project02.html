<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="robots" content="noindex,nofollow"><title>PROJECT 02</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#eee8d8;color:#233329;overflow:hidden}button{font:inherit}.page{height:100dvh;background:#f3efe3;display:flex;flex-direction:column}header{position:relative;z-index:900;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid #d6cbb3;background:rgba(247,243,233,.98)}.row{display:flex;align-items:center;gap:8px}.back{border:0;border-radius:999px;background:#fff;padding:8px 10px;font-size:12px;font-weight:900;color:#34483d}.headcopy{min-width:0;flex:1}.eyebrow{font-size:9px;letter-spacing:.14em;font-weight:900;color:#708177}.title{font-size:clamp(16px,4.8vw,21px);font-weight:1000}.mission{margin-top:6px;font-size:11px;line-height:1.45;font-weight:800;color:#5b675f}.mapwrap{position:relative;flex:1;min-height:0;background:#dfe8dc}#map{position:absolute;inset:0}.status{position:absolute;left:10px;right:10px;top:10px;z-index:650;padding:8px 10px;border-radius:12px;background:rgba(31,47,37,.9);color:#fff;font-size:11px;font-weight:800;pointer-events:none}.legend{position:absolute;right:9px;top:56px;z-index:650;background:rgba(255,255,255,.95);padding:7px 9px;border-radius:11px;font-size:10px;font-weight:900;line-height:1.7;box-shadow:0 4px 14px #0002}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.dock{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:700;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:18px;background:rgba(34,34,28,.92);box-shadow:0 8px 24px #0005}.circle-token{width:66px;height:66px;flex:0 0 66px;border:2px solid #f3c95d;border-radius:50%;background:rgba(240,192,73,.25);color:#fff5cf;font-weight:1000;display:grid;place-items:center;touch-action:none;user-select:none;box-shadow:inset 0 0 0 5px rgba(255,224,132,.12),0 0 16px rgba(240,192,73,.28);cursor:grab}.dockcopy{min-width:0;flex:1;color:#fff}.dockcopy strong{display:block;font-size:12px}.dockcopy span{display:block;margin-top:3px;font-size:10px;line-height:1.35;color:#ddd4bb}.finish{border:1px solid #d5b34f;border-radius:13px;padding:11px 13px;background:#e0bd65;color:#34250c;font-weight:1000;white-space:nowrap}.finish[hidden]{display:none}.ghost{position:fixed;z-index:5000;width:70px;height:70px;border:3px solid #f0c149;border-radius:50%;background:rgba(240,193,73,.2);display:grid;place-items:center;color:#503a09;font-weight:1000;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 6px 24px #0004}.overlay{position:fixed;inset:0;z-index:3000;display:grid;place-items:end center;padding:14px 12px calc(14px + env(safe-area-inset-bottom));background:rgba(18,22,18,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}.overlay[hidden]{display:none}.dialog{width:min(94vw,460px);border:1px solid #d3b66e;border-radius:22px;background:#26251f;color:#fff8e8;padding:14px;box-shadow:0 20px 60px #0008}.char{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center}.char img{width:72px;height:72px;object-fit:contain;border-radius:14px;background:#ffffff10}.name{font-weight:1000;color:#f0ca68}.speech{font-size:14px;line-height:1.65;font-weight:700}.next{width:100%;margin-top:10px;border:0;border-radius:13px;padding:11px;background:#e0bd65;color:#34250c;font-weight:1000}.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.choice button{border:0;border-radius:13px;padding:11px;font-weight:1000}.choice .continue{background:#fff;color:#38483e}.choice .end{background:#e0bd65;color:#34250c}.clear{position:fixed;inset:0;z-index:4000;display:grid;place-items:center;background:radial-gradient(circle,#f9e9a8 0,#dbb94a 20%,#1d241bdc 65%);color:#fff;font-weight:1000;font-size:clamp(56px,17vw,100px);letter-spacing:.08em;text-shadow:0 6px 20px #0008}.clear[hidden]{display:none}.placed-handle{width:24px;height:24px;border-radius:50%;background:#f4c44f;border:3px solid #fff;box-shadow:0 3px 10px #0005}</style></head><body><div class="page"><header><div class="row"><button class="back" onclick="location.href='field-mode.html'">← 戻る</button><div class="headcopy"><div class="eyebrow">CREATIVE MODE / DEVELOPMENT</div><div class="title">PROJECT 02　空いてる場所を選べ</div></div></div><div class="mission">50m円をドラッグして、既存ゲームスポットの間にある「置けそうな空間」を探そう。</div></header><div class="mapwrap"><div id="map"></div><div id="status" class="status">ゲームスポットを読み込んでいます…</div><div class="legend"><div><i style="background:#2789e8"></i>ポケストップ</div><div><i style="background:#e84b4b"></i>ジム</div><div><i style="background:#8a5bd7"></i>パワースポット</div><div><i style="background:#f0c149"></i>あなたの50m円</div></div><div class="dock"><div id="circleToken" class="circle-token">50m</div><div class="dockcopy"><strong>50m円をつかんで地図へ</strong><span>置いた後も中央の●をドラッグして動かせます。</span></div><button id="finishButton" class="finish" hidden>終了する</button></div></div></div><section id="story" class="overlay"><div class="dialog"><div class="char"><img src="assets/riku_decided.png" alt="リク"><div><div class="name">リク</div><div id="storyText" class="speech"></div></div></div><button id="storyNext" class="next">次へ</button></div></section><section id="confirm" class="overlay" hidden><div class="dialog"><div class="char"><img src="assets/riku_decided.png" alt="リク"><div><div class="name">リク</div><div class="speech">この配置で終わる？</div></div></div><div class="choice"><button id="continueButton" class="continue">まだ探す</button><button id="endButton" class="end">終了する</button></div></div></section><div id="clear" class="clear" hidden>CLEAR</div><section id="result" class="overlay" hidden><div class="dialog"><div class="char"><img src="assets/riku_decided.png" alt="リク"><div><div class="name">リク</div><div class="speech">今回は、何個置けたかは気にしなくていい。</div></div></div><div class="speech" style="margin-top:10px">大事なのは、空いている場所を自分で見つけることだ。<br><br>地図の中の「隙間」が見えてくると、設計の選択肢も見えてくるぞ。</div><button class="next" onclick="location.href='field-mode.html'">CREATIVE MODEへ戻る</button></div></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([35.642,139.86],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const existing=L.layerGroup().addTo(map),placed=L.layerGroup().addTo(map),status=document.getElementById('status');const styles={pokestop:['#2789e8',5],gym:['#e84b4b',7],power:['#8a5bd7',6]};let gameSpots=[],placements=[];fetch('projects/project01/gamespots.json?v=20260817-v4',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(data=>{gameSpots=data;const bounds=[];for(const p of data){const s=styles[p.t];if(!s)continue;const c=[p.lat,p.lng];L.circle(c,{radius:50,weight:1,color:s[0],fillColor:s[0],fillOpacity:.055,opacity:.26,interactive:false}).addTo(existing);L.circleMarker(c,{radius:s[1],weight:2,color:'#fff',fillColor:s[0],fillOpacity:.96}).bindTooltip(p.n,{direction:'top'}).addTo(existing);bounds.push(c)}if(bounds.length)map.fitBounds(bounds,{padding:[22,22],maxZoom:16});status.textContent=`既存ゲームスポット ${data.length}地点。空いている場所を探そう。`}).catch(e=>{console.error(e);status.textContent='ゲームスポットの読込に失敗しました。'});const story=document.getElementById('story'),storyText=document.getElementById('storyText'),storyNext=document.getElementById('storyNext'),lines=['今度は見るだけじゃないぞ。','今回は、何個置けたかは気にしなくていい。','大事なのは、空いている場所を自分で見つけることだ。','この50mの円をつかんで、置けそうだと思う場所まで持っていってみてくれ。'];let si=0;storyText.textContent=lines[0];storyNext.onclick=()=>{si++;if(si<lines.length){storyText.textContent=lines[si];storyNext.textContent=si===lines.length-1?'やってみる！':'次へ'}else{story.hidden=true;setTimeout(()=>map.invalidateSize(),80)}};function nearestDistance(latlng){let best=Infinity;for(const p of gameSpots){const d=map.distance(latlng,L.latLng(p.lat,p.lng));if(d<best)best=d}for(const x of placements){if(x.latlng===latlng)continue;const d=map.distance(latlng,x.latlng);if(d<best)best=d}return best}function refreshStatus(latlng){const d=nearestDistance(latlng);if(!Number.isFinite(d)){status.textContent=`${placements.length}個配置中`;return}status.textContent=d<50?`ここは少し近そうだ。最寄りまで約${Math.round(d)}m。`:`いい隙間だな。最寄りまで約${Math.round(d)}m。`}function addPlacement(latlng){const circle=L.circle(latlng,{radius:50,weight:2,color:'#c58b00',fillColor:'#f0c149',fillOpacity:.18,opacity:.9,interactive:false}).addTo(placed);const icon=L.divIcon({className:'',html:'<div class="placed-handle"></div>',iconSize:[24,24],iconAnchor:[12,12]});const handle=L.marker(latlng,{icon,draggable:true,autoPan:true}).addTo(placed);const item={latlng:L.latLng(latlng),circle,handle};placements.push(item);handle.on('drag',e=>{item.latlng=e.target.getLatLng();circle.setLatLng(item.latlng);refreshStatus(item.latlng)});handle.on('dragend',e=>refreshStatus(e.target.getLatLng()));document.getElementById('finishButton').hidden=false;refreshStatus(item.latlng);if(navigator.vibrate)navigator.vibrate(20)}const token=document.getElementById('circleToken');let ghost=null,dragging=false;function moveGhost(x,y){if(!ghost){ghost=document.createElement('div');ghost.className='ghost';ghost.textContent='50m';document.body.appendChild(ghost)}ghost.style.left=x+'px';ghost.style.top=y+'px'}function endTokenDrag(e){if(!dragging)return;dragging=false;token.releasePointerCapture?.(e.pointerId);const rect=map.getContainer().getBoundingClientRect();if(e.clientX>=rect.left&&e.clientX<=rect.right&&e.clientY>=rect.top&&e.clientY<=rect.bottom){const point=L.point(e.clientX-rect.left,e.clientY-rect.top);addPlacement(map.containerPointToLatLng(point))}ghost?.remove();ghost=null}token.addEventListener('pointerdown',e=>{dragging=true;token.setPointerCapture?.(e.pointerId);moveGhost(e.clientX,e.clientY);e.preventDefault()});token.addEventListener('pointermove',e=>{if(!dragging)return;moveGhost(e.clientX,e.clientY);e.preventDefault()});token.addEventListener('pointerup',endTokenDrag);token.addEventListener('pointercancel',e=>{dragging=false;ghost?.remove();ghost=null});const confirm=document.getElementById('confirm');document.getElementById('finishButton').onclick=()=>confirm.hidden=false;document.getElementById('continueButton').onclick=()=>confirm.hidden=true;document.getElementById('endButton').onclick=()=>{confirm.hidden=true;const clear=document.getElementById('clear');clear.hidden=false;if(navigator.vibrate)navigator.vibrate(35);setTimeout(()=>{clear.hidden=true;document.getElementById('result').hidden=false},850)};</script></body></html>
