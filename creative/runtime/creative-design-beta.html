<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>CREATIVE MODE β | Campsite Design</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--cream:#fffaf0;--brown:#6f471c;--line:#c9b58f;--blue:#0b4d8b;--red:#d33b2f}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#231509;color:#2f2a21}button{font:inherit;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column}.devbar{height:54px;flex:0 0 54px;background:linear-gradient(180deg,#8a2f0f,#68230d);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;letter-spacing:.16em}.devbar::before{content:'●';color:#f6bd5a;margin-right:8px;font-size:9px}.mapwrap{position:relative;flex:1;min-height:0;background:#dcebd8}.map{position:absolute;inset:0}.leaflet-control-zoom{display:none!important}.leaflet-control-attribution{font-size:9px!important}.float{position:absolute;z-index:800;border:1px solid rgba(121,91,50,.55);background:rgba(255,253,247,.96);color:#3b2e1d;box-shadow:0 6px 18px rgba(38,24,7,.16);font-weight:900}.toolbox{top:12px;left:12px;width:54px;height:54px;border-radius:16px;font-size:26px}.back{top:15px;left:76px;min-height:46px;padding:0 16px;border-radius:23px;font-size:13px}.map-switch{top:15px;right:12px;min-height:46px;padding:0 16px;border-radius:16px;color:#153b69;font-size:13px}.crosshair{position:absolute;z-index:750;left:50%;top:50%;width:58px;height:58px;transform:translate(-50%,-50%);pointer-events:none;opacity:.96}.crosshair::before,.crosshair::after{content:'';position:absolute;background:#fff;border-radius:4px;box-shadow:0 0 0 1px rgba(70,70,70,.12)}.crosshair::before{width:5px;height:58px;left:26.5px;top:0}.crosshair::after{height:5px;width:58px;left:0;top:26.5px}.crosshair-ring{position:absolute;left:6px;top:6px;width:46px;height:46px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(70,70,70,.12)}.crosshair-dot{position:absolute;left:25px;top:25px;width:8px;height:8px;background:#fff;border-radius:50%}.placement-row{position:absolute;z-index:820;right:12px;bottom:76px;display:flex;align-items:center;gap:8px}.type-btn,.place-btn,.cancel-btn{min-height:52px;border-radius:26px;background:rgba(255,253,247,.98);border:1px solid rgba(121,91,50,.6);box-shadow:0 6px 18px rgba(38,24,7,.16);font-weight:900}.type-btn{padding:0 18px;color:#34281c}.place-btn{min-width:126px;padding:0 20px;color:#0e447c;border-color:#d15747;font-size:16px}.place-btn .plus{font-size:30px;line-height:0;vertical-align:-3px;margin-right:5px}.cancel-btn{position:absolute;z-index:820;left:14px;bottom:76px;padding:0 24px}.history{height:64px;flex:0 0 64px;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#33291d}.history button{border:0;border-radius:12px;background:#d4c8ad;color:#4a3d2a;font-weight:900}.history button:disabled{opacity:.4}.sheet-backdrop{position:absolute;z-index:900;inset:0;background:rgba(25,18,10,.24);display:none}.sheet-backdrop.open{display:block}.sheet{position:absolute;z-index:910;left:12px;right:12px;bottom:12px;padding:16px;background:#fffaf0;border:1px solid #c9b58f;border-radius:20px;box-shadow:0 16px 40px rgba(0,0,0,.28);transform:translateY(120%);transition:transform .18s ease}.sheet.open{transform:translateY(0)}.sheet h2{font-size:16px;margin:0 0 12px}.sheet label{font-size:12px;font-weight:900}.sheet input[type=file]{width:100%;margin:7px 0 6px}.status{font-size:11px;color:#716756;line-height:1.45;min-height:32px}.selected{font-size:12px;font-weight:900;margin:10px 0 6px}.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.sheet-btn{min-height:44px;border:1px solid #aa8c57;border-radius:12px;background:#fff;color:#453723;font-weight:900}.sheet-btn.primary{background:#e2c377}.sheet-btn.danger{border-color:#d9a69e;background:#fff1ef;color:#9b4136}.sheet-btn:disabled{opacity:.4}.close-sheet{width:100%;margin-top:10px}.distance-toast{position:absolute;z-index:810;left:50%;bottom:140px;transform:translateX(-50%);max-width:78%;padding:8px 12px;border-radius:999px;background:rgba(255,253,247,.95);border:1px solid #b99b68;font-size:11px;font-weight:900;box-shadow:0 4px 14px rgba(0,0,0,.12);opacity:0;pointer-events:none;transition:opacity .15s}.distance-toast.show{opacity:1}.distance-toast.warn{border-color:#c85643;color:#9a3125}.addmode{outline:3px solid rgba(201,151,50,.22);outline-offset:-3px}
@media(max-width:420px){.type-btn{padding:0 14px}.place-btn{min-width:112px;padding:0 15px}.back{padding:0 13px}.map-switch{padding:0 13px}}
</style>
</head>
<body>
<header class="devbar">DEVELOPMENT / 開発版</header>
<div class="mapwrap" id="mapwrap">
  <div id="map" class="map"></div>
  <button id="toolbox" class="float toolbox" type="button" aria-label="道具箱">🧰</button>
  <button id="back" class="float back" type="button">× 閲覧へ戻る</button>
  <button id="mapSwitch" class="float map-switch" type="button">🗺 地図切り替え</button>
  <div class="crosshair" aria-hidden="true"><span class="crosshair-ring"></span><span class="crosshair-dot"></span></div>
  <div id="distanceToast" class="distance-toast">50m判定：待機中</div>
  <button id="cancelPlace" class="cancel-btn" type="button">× 設置中止</button>
  <div class="placement-row"><button id="typeBtn" class="type-btn" type="button">🛑 ポケストップ</button><button id="add" class="place-btn" type="button" disabled><span class="plus">＋</span>設置</button></div>
  <div id="sheetBackdrop" class="sheet-backdrop"></div>
  <section id="toolSheet" class="sheet" aria-label="道具箱">
    <h2>🧰 道具箱</h2>
    <label>設計元の KMZ / KML<input id="file" type="file" accept=".kmz,.kml,.zip"></label>
    <div id="fileStatus" class="status">ファイルを選ぶと地図上で設計できます。</div>
    <div id="selected" class="selected">POI未選択</div>
    <div class="sheet-grid"><button id="delete" class="sheet-btn danger" disabled>選択POIを削除</button><button id="clearSel" class="sheet-btn" disabled>選択解除</button></div>
    <div class="sheet-grid"><button id="export" class="sheet-btn primary" disabled>KMZを書き出す</button><button id="closeSheet" class="sheet-btn">地図へ戻る</button></div>
  </section>
</div>
<nav class="history"><button id="undo" type="button" disabled>↶ 元に戻す</button><button id="redo" type="button" disabled>やり直す ↷</button></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const RADIUS=50,KML_NS='http://www.opengis.net/kml/2.2';
const $=id=>document.getElementById(id),fileEl=$('file'),fileStatus=$('fileStatus'),selectedEl=$('selected'),addBtn=$('add'),deleteBtn=$('delete'),undoBtn=$('undo'),redoBtn=$('redo'),exportBtn=$('export'),clearSelBtn=$('clearSel'),mapwrap=$('mapwrap'),toolboxBtn=$('toolbox'),toolSheet=$('toolSheet'),sheetBackdrop=$('sheetBackdrop'),closeSheetBtn=$('closeSheet'),mapSwitchBtn=$('mapSwitch'),cancelPlaceBtn=$('cancelPlace'),backBtn=$('back'),distanceToast=$('distanceToast');
const map=L.map('map',{zoomControl:false}).setView([35.6812,139.7671],15);const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap'}).addTo(map);const aerial=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles &copy; Esri'});let aerialMode=false;
const poiLayer=L.layerGroup().addTo(map),shapeLayer=L.layerGroup().addTo(map);let records=[],selected=null,addMode=false,sourceName='campsite',sourceText='',sourceZip=null,sourceKmlPath='',sourceIsKmz=false;const undoStack=[],redoStack=[];
function openSheet(){toolSheet.classList.add('open');sheetBackdrop.classList.add('open')}function closeSheet(){toolSheet.classList.remove('open');sheetBackdrop.classList.remove('open')}toolboxBtn.addEventListener('click',openSheet);closeSheetBtn.addEventListener('click',closeSheet);sheetBackdrop.addEventListener('click',closeSheet);backBtn.addEventListener('click',()=>location.href='lab.html');
mapSwitchBtn.addEventListener('click',()=>{aerialMode=!aerialMode;if(aerialMode){map.removeLayer(osm);aerial.addTo(map);mapSwitchBtn.textContent='🗺 通常地図'}else{map.removeLayer(aerial);osm.addTo(map);mapSwitchBtn.textContent='🗺 地図切り替え'}});
function directText(el,tag){const n=Array.from(el.children||[]).find(x=>(x.localName||'').toLowerCase()===tag.toLowerCase());return n?.textContent?.trim()||''}function folderName(pm){let n=pm.parentElement;while(n){if((n.localName||'').toLowerCase()==='folder')return directText(n,'name');n=n.parentElement}return ''}function parseCoord(text){const p=String(text||'').trim().split(',').map(Number);return Number.isFinite(p[0])&&Number.isFinite(p[1])?[p[1],p[0]]:null}function isAdded(folder,name){return /追加|追加予定|追加希望|追加候補|候補|新設|add|planned|candidate|proposed/i.test(`${folder} ${name}`)}function isCircleFolder(name){return /円|30m|40m|50m/i.test(name)}function activeAdded(){return records.filter(r=>r.added&&!r.deleted)}function meters(a,b){return map.distance(L.latLng(a),L.latLng(b))}function nearestDistance(pos,exclude){let best=Infinity;for(const r of records){if(r.deleted||r===exclude)continue;best=Math.min(best,meters(pos,r.latlng))}return best}
let toastTimer=null;function updateDistance(pos,exclude,show=false){if(!pos)return;const d=nearestDistance(pos,exclude);distanceToast.classList.toggle('warn',Number.isFinite(d)&&d<RADIUS);distanceToast.textContent=!Number.isFinite(d)?'● 50m以上を確保':d>=RADIUS?`● 50m以上を確保（最短 ${d.toFixed(1)}m）`:`⚠ 50m未満（最短 ${d.toFixed(1)}m）`;if(show){distanceToast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>distanceToast.classList.remove('show'),1700)}}
function styleRecord(r){if(!r.marker)return;const active=r===selected;r.marker.setStyle({radius:active?11:(r.added?8:6),weight:active?4:2,color:r.added?'#9b6a00':'#315c84',fillColor:r.added?'#ffd35c':'#7ebbe8',fillOpacity:.92})}function selectRecord(r){if(r?.deleted)return;if(selected)styleRecord(selected);selected=r;styleRecord(r);selectedEl.textContent=`選択中：${r.name}${r.isNew?'（新規）':''}`;deleteBtn.disabled=!r.added;clearSelBtn.disabled=false;updateDistance(r.latlng,r,true)}function clearSelection(){if(selected)styleRecord(selected);selected=null;selectedEl.textContent='POI未選択';deleteBtn.disabled=true;clearSelBtn.disabled=true}
function bindRecord(r){const circle=L.circle(r.latlng,{radius:RADIUS,color:r.added?'#7a4d18':'#7a4d18',weight:2,opacity:.85,fillOpacity:.025,interactive:false}).addTo(poiLayer);const marker=L.circleMarker(r.latlng,{draggable:false}).addTo(poiLayer);r.circle=circle;r.marker=marker;styleRecord(r);marker.bindTooltip(r.name,{direction:'top'});marker.on('click',()=>selectRecord(r));if(r.added)enableDrag(r)}
function enableDrag(r){const marker=r.marker;marker.on('mousedown touchstart',()=>{if(addMode)return;const start=L.latLng(r.latlng);let moved=false;function move(e){if(!e.latlng)return;moved=true;const ll=e.latlng;r.latlng=[ll.lat,ll.lng];marker.setLatLng(ll);r.circle.setLatLng(ll);updateDistance(r.latlng,r,false)}function end(){map.off('mousemove',move);map.off('mouseup',end);map.dragging.enable();if(moved){undoStack.push({kind:'move',record:r,from:[start.lat,start.lng],to:[...r.latlng]});redoStack.length=0;updateHistory();exportBtn.disabled=false;updateDistance(r.latlng,r,true)}}map.dragging.disable();map.on('mousemove',move);map.once('mouseup',end)})}
function updateHistory(){undoBtn.disabled=!undoStack.length;redoBtn.disabled=!redoStack.length}function removeVisual(r){if(r.marker&&poiLayer.hasLayer(r.marker))poiLayer.removeLayer(r.marker);if(r.circle&&poiLayer.hasLayer(r.circle))poiLayer.removeLayer(r.circle)}function restoreVisual(r){r.deleted=false;bindRecord(r);selectRecord(r)}
function addRecord(latlng){const name=prompt('追加POIの名前','追加希望POI');if(name===null)return;const r={name:name.trim()||'追加希望POI',folder:'追加希望POI',description:'',latlng:[latlng.lat,latlng.lng],originalLatlng:[latlng.lat,latlng.lng],added:true,isNew:true,deleted:false,sourceIndex:null};records.push(r);bindRecord(r);undoStack.push({kind:'add',record:r});redoStack.length=0;updateHistory();selectRecord(r);exportBtn.disabled=false;updateDistance(r.latlng,r,true)}
function setPlacementMode(on){addMode=on;mapwrap.classList.toggle('addmode',on);cancelPlaceBtn.style.visibility=on?'visible':'hidden';addBtn.innerHTML=on?'<span class="plus">＋</span>ここに設置':'<span class="plus">＋</span>設置'}addBtn.addEventListener('click',()=>{if(!addMode){setPlacementMode(true);updateDistance(map.getCenter(),null,true);return}const c=map.getCenter();addRecord(c);setPlacementMode(false)});cancelPlaceBtn.addEventListener('click',()=>setPlacementMode(false));map.on('move',()=>{if(addMode)updateDistance(map.getCenter(),null,false)});map.on('moveend',()=>{if(addMode)updateDistance(map.getCenter(),null,true)});
deleteBtn.addEventListener('click',()=>{if(!selected?.added)return;const r=selected;if(!confirm(`「${r.name}」を削除しますか？`))return;r.deleted=true;removeVisual(r);undoStack.push({kind:'delete',record:r});redoStack.length=0;clearSelection();updateHistory();exportBtn.disabled=false});clearSelBtn.addEventListener('click',clearSelection);
undoBtn.addEventListener('click',()=>{const a=undoStack.pop();if(!a)return;if(a.kind==='add'){a.record.deleted=true;removeVisual(a.record);if(selected===a.record)clearSelection()}else if(a.kind==='delete'){restoreVisual(a.record)}else if(a.kind==='move'){a.record.latlng=[...a.from];a.record.marker.setLatLng(a.from);a.record.circle.setLatLng(a.from);selectRecord(a.record)}redoStack.push(a);updateHistory();exportBtn.disabled=false});redoBtn.addEventListener('click',()=>{const a=redoStack.pop();if(!a)return;if(a.kind==='add'){restoreVisual(a.record)}else if(a.kind==='delete'){a.record.deleted=true;removeVisual(a.record);if(selected===a.record)clearSelection()}else if(a.kind==='move'){a.record.latlng=[...a.to];a.record.marker.setLatLng(a.to);a.record.circle.setLatLng(a.to);selectRecord(a.record)}undoStack.push(a);updateHistory();exportBtn.disabled=false});
function render(text){sourceText=text;const xml=new DOMParser().parseFromString(text,'application/xml');if(xml.querySelector('parsererror'))throw new Error('KMLを解析できませんでした');poiLayer.clearLayers();shapeLayer.clearLayers();records=[];clearSelection();undoStack.length=redoStack.length=0;updateHistory();const bounds=[];const pms=Array.from(xml.getElementsByTagNameNS('*','Placemark'));pms.forEach((pm,index)=>{const name=directText(pm,'name')||'名称なし',folder=folderName(pm);const point=pm.getElementsByTagNameNS('*','Point')[0];if(point&&!isCircleFolder(folder)){const c=point.getElementsByTagNameNS('*','coordinates')[0],ll=parseCoord(c?.textContent);if(!ll)return;const r={name,folder,description:directText(pm,'description'),latlng:[...ll],originalLatlng:[...ll],added:isAdded(folder,name),isNew:false,deleted:false,sourceIndex:index};records.push(r);bindRecord(r);bounds.push(ll);return}const line=pm.getElementsByTagNameNS('*','LineString')[0],poly=pm.getElementsByTagNameNS('*','Polygon')[0],geom=line||poly;if(!geom||isCircleFolder(folder))return;Array.from(geom.getElementsByTagNameNS('*','coordinates')).forEach(c=>{const pts=String(c.textContent||'').trim().split(/\s+/).map(parseCoord).filter(Boolean);if(pts.length<2)return;(poly?L.polygon(pts,{color:'#8b6a2f',weight:2,fillOpacity:.04,interactive:false}):L.polyline(pts,{color:'#8b6a2f',weight:2,opacity:.55,interactive:false})).addTo(shapeLayer);bounds.push(...pts)})});if(bounds.length)map.fitBounds(bounds,{padding:[24,24],maxZoom:18});addBtn.disabled=false;exportBtn.disabled=false;fileStatus.textContent=`読込完了：${records.length}地点 ／ 追加POI ${activeAdded().length}件`;closeSheet();setTimeout(()=>map.invalidateSize(),50)}
async function readFile(file){sourceName=file.name.replace(/\.[^.]+$/,'')||'campsite';const lower=file.name.toLowerCase();sourceIsKmz=!lower.endsWith('.kml');if(!sourceIsKmz){sourceZip=null;sourceKmlPath='doc.kml';return file.text()}sourceZip=await JSZip.loadAsync(await file.arrayBuffer());const names=Object.keys(sourceZip.files).filter(n=>n.toLowerCase().endsWith('.kml')&&!sourceZip.files[n].dir);if(!names.length)throw new Error('KMZ内にKMLがありません');sourceKmlPath=names.find(n=>/(^|\/)doc\.kml$/i.test(n))||names[0];return sourceZip.files[sourceKmlPath].async('string')}
fileEl.addEventListener('change',async()=>{const f=fileEl.files?.[0];if(!f)return;fileStatus.textContent='読込中…';try{render(await readFile(f))}catch(e){console.error(e);fileStatus.textContent=`⚠ ${e.message||'読込失敗'}`}});
function circleCoords(lat,lng){const out=[],earth=6378137,lat0=lat*Math.PI/180,lng0=lng*Math.PI/180;for(let i=0;i<=36;i++){const a=i/36*2*Math.PI,pLat=Math.asin(Math.sin(lat0)*Math.cos(RADIUS/earth)+Math.cos(lat0)*Math.sin(RADIUS/earth)*Math.cos(a)),pLng=lng0+Math.atan2(Math.sin(a)*Math.sin(RADIUS/earth)*Math.cos(lat0),Math.cos(RADIUS/earth)-Math.sin(lat0)*Math.sin(pLat));out.push(`${(pLng*180/Math.PI).toFixed(7)},${(pLat*180/Math.PI).toFixed(7)},0`)}return out.join(' ')}function makeEl(xml,name,text){const e=xml.createElementNS(KML_NS,name);if(text!==undefined)e.textContent=text;return e}
function rebuildKml(){const xml=new DOMParser().parseFromString(sourceText,'application/xml'),pms=Array.from(xml.getElementsByTagNameNS('*','Placemark'));for(const r of records){if(r.isNew)continue;const pm=pms[r.sourceIndex];if(!pm)continue;if(r.deleted){pm.remove();continue}if(r.added){const c=pm.getElementsByTagNameNS('*','Point')[0]?.getElementsByTagNameNS('*','coordinates')[0];if(c)c.textContent=`${r.latlng[1].toFixed(7)},${r.latlng[0].toFixed(7)},0`}}const doc=xml.getElementsByTagNameNS('*','Document')[0]||xml.documentElement;Array.from(xml.getElementsByTagNameNS('*','Folder')).filter(f=>/50m/.test(directText(f,'name'))&&/円/.test(directText(f,'name'))).forEach(f=>f.remove());let addFolder=Array.from(xml.getElementsByTagNameNS('*','Folder')).find(f=>/追加希望POI/.test(directText(f,'name')));if(!addFolder){addFolder=makeEl(xml,'Folder');addFolder.appendChild(makeEl(xml,'name','追加希望POI'));doc.appendChild(addFolder)}for(const r of records.filter(r=>r.isNew&&!r.deleted)){const pm=makeEl(xml,'Placemark');pm.appendChild(makeEl(xml,'name',r.name));if(r.description)pm.appendChild(makeEl(xml,'description',r.description));const pt=makeEl(xml,'Point');pt.appendChild(makeEl(xml,'coordinates',`${r.latlng[1].toFixed(7)},${r.latlng[0].toFixed(7)},0`));pm.appendChild(pt);addFolder.appendChild(pm)}const circleFolder=makeEl(xml,'Folder');circleFolder.appendChild(makeEl(xml,'name','50m円（目安）'));for(const r of records.filter(r=>!r.deleted)){const pm=makeEl(xml,'Placemark');pm.appendChild(makeEl(xml,'name',`${r.name}_50m円`));const poly=makeEl(xml,'Polygon'),outer=makeEl(xml,'outerBoundaryIs'),ring=makeEl(xml,'LinearRing');ring.appendChild(makeEl(xml,'coordinates',circleCoords(r.latlng[0],r.latlng[1])));outer.appendChild(ring);poly.appendChild(outer);pm.appendChild(poly);circleFolder.appendChild(pm)}doc.appendChild(circleFolder);return new XMLSerializer().serializeToString(xml)}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
exportBtn.addEventListener('click',async()=>{if(!sourceText)return;exportBtn.disabled=true;fileStatus.textContent='書き出し中…';try{const kml=rebuildKml();if(sourceIsKmz){const zip=await JSZip.loadAsync(await sourceZip.generateAsync({type:'blob'}));zip.file(sourceKmlPath,kml);downloadBlob(await zip.generateAsync({type:'blob',compression:'DEFLATE'}),`${sourceName}_CREATIVE.kmz`)}else downloadBlob(new Blob([kml],{type:'application/vnd.google-earth.kml+xml'}),`${sourceName}_CREATIVE.kml`);fileStatus.textContent='書き出し完了。距離チェックへ進めます。'}catch(e){console.error(e);fileStatus.textContent=`⚠ 書き出し失敗：${e.message||e}`}finally{exportBtn.disabled=false}});
setPlacementMode(false);openSheet();
</script>
</body>
</html>
