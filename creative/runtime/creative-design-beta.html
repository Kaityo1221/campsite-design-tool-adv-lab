<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>CREATIVE MODE β | Campsite Design</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f1e8;color:#2f2a21}body{display:flex;flex-direction:column}.top{padding:12px 14px;background:#fffaf0;border-bottom:1px solid #d9ceb8;display:flex;gap:10px;align-items:center;justify-content:space-between}.title b{display:block;font-size:18px}.title small{font-size:11px;color:#786e5e}.badge{font-size:11px;font-weight:800;padding:6px 9px;border:1px solid #b89a62;border-radius:999px;background:#fff4d7}.load{padding:10px 12px;background:#fffdf8;border-bottom:1px solid #ded4c2}.load label{display:block;font-size:12px;font-weight:800}.load input{display:block;width:100%;margin-top:6px}.status{font-size:11px;color:#716756;margin-top:6px}.mapwrap{position:relative;flex:1;min-height:280px}.map{position:absolute;inset:0}.hud{position:absolute;left:10px;right:10px;top:10px;z-index:700;display:flex;gap:8px;pointer-events:none}.pill{background:rgba(255,255,255,.94);border:1px solid #cabd9f;border-radius:12px;padding:8px 10px;font-size:12px;font-weight:800;box-shadow:0 4px 18px rgba(0,0,0,.08)}.hud .pill:last-child{margin-left:auto}.panel{padding:10px 12px 14px;background:#fffaf0;border-top:1px solid #d9ceb8}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.row.three{grid-template-columns:1fr 1fr 1fr}.btn{min-height:44px;border-radius:12px;border:1px solid #a98b56;background:#fff;color:#443722;font-weight:900;font-size:13px}.btn.primary{background:#e2c377}.btn.danger{border-color:#d7a39a;background:#fff1ef;color:#9b4136}.btn:disabled{opacity:.4}.hint{font-size:11px;color:#766b5b;line-height:1.5;margin-top:8px}.selected{font-size:12px;font-weight:800;min-height:18px}.addmode{outline:3px solid rgba(201,151,50,.25)}
</style>
</head>
<body>
<header class="top"><div class="title"><b>CREATIVE MODE β</b><small>番外編・キャンプサイト設計専用</small></div><div class="badge">実験機能</div></header>
<section class="load"><label>設計元の KMZ / KML<input id="file" type="file" accept=".kmz,.kml,.zip"></label><div id="fileStatus" class="status">ファイルを選ぶと地図上で設計できます。</div></section>
<div class="mapwrap" id="mapwrap"><div id="map" class="map"></div><div class="hud"><div id="distance" class="pill">50m判定：待機中</div><div id="count" class="pill">追加POI 0件</div></div></div>
<section class="panel"><div id="selected" class="selected">POI未選択</div><div class="row three"><button id="add" class="btn primary" disabled>＋ POI追加</button><button id="delete" class="btn danger" disabled>削除</button><button id="center" class="btn" disabled>現在地</button></div><div class="row"><button id="undo" class="btn" disabled>← 戻る</button><button id="redo" class="btn" disabled>進む →</button></div><div class="row"><button id="export" class="btn primary" disabled>KMZを書き出す</button><button id="clearSel" class="btn" disabled>選択解除</button></div><div class="hint">追加POIはドラッグで移動できます。50m円は移動に追従します。「POI追加」を押した後、地図をタップして設置してください。</div></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const RADIUS=50,KML_NS='http://www.opengis.net/kml/2.2';
const $=id=>document.getElementById(id),fileEl=$('file'),fileStatus=$('fileStatus'),distanceEl=$('distance'),countEl=$('count'),selectedEl=$('selected'),addBtn=$('add'),deleteBtn=$('delete'),centerBtn=$('center'),undoBtn=$('undo'),redoBtn=$('redo'),exportBtn=$('export'),clearSelBtn=$('clearSel'),mapwrap=$('mapwrap');
const map=L.map('map',{zoomControl:true}).setView([35.6812,139.7671],15);const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap'}).addTo(map);const aerial=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles &copy; Esri'});L.control.layers({'地図':osm,'航空写真':aerial},null,{position:'topright'}).addTo(map);
const poiLayer=L.layerGroup().addTo(map),shapeLayer=L.layerGroup().addTo(map);let records=[],selected=null,addMode=false,sourceName='campsite',sourceText='',sourceZip=null,sourceKmlPath='',sourceIsKmz=false,currentPos=null;const undoStack=[],redoStack=[];
function directText(el,tag){const n=Array.from(el.children||[]).find(x=>(x.localName||'').toLowerCase()===tag.toLowerCase());return n?.textContent?.trim()||''}function folderName(pm){let n=pm.parentElement;while(n){if((n.localName||'').toLowerCase()==='folder')return directText(n,'name');n=n.parentElement}return ''}function parseCoord(text){const p=String(text||'').trim().split(',').map(Number);return Number.isFinite(p[0])&&Number.isFinite(p[1])?[p[1],p[0]]:null}function isAdded(folder,name){return /追加|追加予定|追加希望|追加候補|候補|新設|add|planned|candidate|proposed/i.test(`${folder} ${name}`)}function isCircleFolder(name){return /円|30m|40m|50m/i.test(name)}
function activeAdded(){return records.filter(r=>r.added&&!r.deleted)}function updateCount(){countEl.textContent=`追加POI ${activeAdded().length}件`}function meters(a,b){return map.distance(L.latLng(a),L.latLng(b))}function nearestDistance(pos,exclude){let best=Infinity;for(const r of records){if(r.deleted||r===exclude)continue;best=Math.min(best,meters(pos,r.latlng))}return best}function updateDistance(pos,exclude){if(!pos){distanceEl.textContent='50m判定：待機中';return}const d=nearestDistance(pos,exclude);distanceEl.textContent=!Number.isFinite(d)?'50m判定：OK':d>=RADIUS?`50m判定：OK（最短 ${d.toFixed(1)}m）`:`⚠ 50m未満（最短 ${d.toFixed(1)}m）`}
function styleRecord(r){if(!r.marker)return;const active=r===selected;r.marker.setStyle({radius:active?11:(r.added?8:6),weight:active?4:2,color:r.added?'#9b6a00':'#315c84',fillColor:r.added?'#ffd35c':'#7ebbe8',fillOpacity:.92})}
function selectRecord(r){if(r?.deleted)return;if(selected)styleRecord(selected);selected=r;styleRecord(r);selectedEl.textContent=`選択中：${r.name}${r.isNew?'（新規）':''}`;deleteBtn.disabled=!r.added;clearSelBtn.disabled=false;updateDistance(r.latlng,r)}function clearSelection(){if(selected)styleRecord(selected);selected=null;selectedEl.textContent='POI未選択';deleteBtn.disabled=true;clearSelBtn.disabled=true;updateDistance(currentPos,null)}
function bindRecord(r){const circle=L.circle(r.latlng,{radius:RADIUS,color:r.added?'#bb8a25':'#4f7da2',weight:1,opacity:.65,fillOpacity:.03,interactive:false}).addTo(poiLayer);const marker=L.circleMarker(r.latlng,{draggable:false}).addTo(poiLayer);r.circle=circle;r.marker=marker;styleRecord(r);marker.bindTooltip(r.name,{direction:'top'});marker.on('click',()=>selectRecord(r));if(r.added){marker.on('mousedown',()=>{if(!selected||selected!==r)selectRecord(r)});enableDrag(r)}}
function enableDrag(r){const marker=r.marker;marker.on('mousedown touchstart',ev=>{if(addMode)return;const start=L.latLng(r.latlng);let moved=false;function move(e){moved=true;const ll=e.latlng;r.latlng=[ll.lat,ll.lng];marker.setLatLng(ll);r.circle.setLatLng(ll);updateDistance(r.latlng,r)}function end(){map.off('mousemove',move);map.off('mouseup',end);map.dragging.enable();if(moved){undoStack.push({kind:'move',record:r,from:[start.lat,start.lng],to:[...r.latlng]});redoStack.length=0;updateHistory();exportBtn.disabled=false} }map.dragging.disable();map.on('mousemove',move);map.once('mouseup',end)})}
function updateHistory(){undoBtn.disabled=!undoStack.length;redoBtn.disabled=!redoStack.length}function removeVisual(r){if(r.marker&&poiLayer.hasLayer(r.marker))poiLayer.removeLayer(r.marker);if(r.circle&&poiLayer.hasLayer(r.circle))poiLayer.removeLayer(r.circle)}function restoreVisual(r){r.deleted=false;bindRecord(r);selectRecord(r)}
function addRecord(latlng){const name=prompt('追加POIの名前','追加希望POI');if(name===null)return;const r={name:name.trim()||'追加希望POI',folder:'追加希望POI',description:'',latlng:[latlng.lat,latlng.lng],originalLatlng:[latlng.lat,latlng.lng],added:true,isNew:true,deleted:false,sourceIndex:null};records.push(r);bindRecord(r);undoStack.push({kind:'add',record:r});redoStack.length=0;updateHistory();updateCount();selectRecord(r);exportBtn.disabled=false}
addBtn.addEventListener('click',()=>{addMode=!addMode;mapwrap.classList.toggle('addmode',addMode);addBtn.textContent=addMode?'地図をタップ':'＋ POI追加'});map.on('click',e=>{if(!addMode)return;addMode=false;mapwrap.classList.remove('addmode');addBtn.textContent='＋ POI追加';addRecord(e.latlng)});deleteBtn.addEventListener('click',()=>{if(!selected?.added)return;const r=selected;if(!confirm(`「${r.name}」を削除しますか？`))return;r.deleted=true;removeVisual(r);undoStack.push({kind:'delete',record:r});redoStack.length=0;clearSelection();updateHistory();updateCount();exportBtn.disabled=false});clearSelBtn.addEventListener('click',clearSelection);
undoBtn.addEventListener('click',()=>{const a=undoStack.pop();if(!a)return;if(a.kind==='add'){a.record.deleted=true;removeVisual(a.record);if(selected===a.record)clearSelection()}else if(a.kind==='delete'){restoreVisual(a.record)}else if(a.kind==='move'){a.record.latlng=[...a.from];a.record.marker.setLatLng(a.from);a.record.circle.setLatLng(a.from);selectRecord(a.record)}redoStack.push(a);updateHistory();updateCount();exportBtn.disabled=false});redoBtn.addEventListener('click',()=>{const a=redoStack.pop();if(!a)return;if(a.kind==='add'){restoreVisual(a.record)}else if(a.kind==='delete'){a.record.deleted=true;removeVisual(a.record);if(selected===a.record)clearSelection()}else if(a.kind==='move'){a.record.latlng=[...a.to];a.record.marker.setLatLng(a.to);a.record.circle.setLatLng(a.to);selectRecord(a.record)}undoStack.push(a);updateHistory();updateCount();exportBtn.disabled=false});
function render(text){sourceText=text;const xml=new DOMParser().parseFromString(text,'application/xml');if(xml.querySelector('parsererror'))throw new Error('KMLを解析できませんでした');poiLayer.clearLayers();shapeLayer.clearLayers();records=[];clearSelection();undoStack.length=redoStack.length=0;updateHistory();const bounds=[];const pms=Array.from(xml.getElementsByTagNameNS('*','Placemark'));pms.forEach((pm,index)=>{const name=directText(pm,'name')||'名称なし',folder=folderName(pm);const point=pm.getElementsByTagNameNS('*','Point')[0];if(point&&!isCircleFolder(folder)){const c=point.getElementsByTagNameNS('*','coordinates')[0];const ll=parseCoord(c?.textContent);if(!ll)return;const r={name,folder,description:directText(pm,'description'),latlng:[...ll],originalLatlng:[...ll],added:isAdded(folder,name),isNew:false,deleted:false,sourceIndex:index};records.push(r);bindRecord(r);bounds.push(ll);return}const line=pm.getElementsByTagNameNS('*','LineString')[0],poly=pm.getElementsByTagNameNS('*','Polygon')[0];const geom=line||poly;if(!geom||isCircleFolder(folder))return;Array.from(geom.getElementsByTagNameNS('*','coordinates')).forEach(c=>{const pts=String(c.textContent||'').trim().split(/\s+/).map(parseCoord).filter(Boolean);if(pts.length<2)return;(poly?L.polygon(pts,{color:'#8b6a2f',weight:2,fillOpacity:.04,interactive:false}):L.polyline(pts,{color:'#8b6a2f',weight:2,opacity:.55,interactive:false})).addTo(shapeLayer);bounds.push(...pts)})});if(bounds.length)map.fitBounds(bounds,{padding:[24,24],maxZoom:18});addBtn.disabled=false;exportBtn.disabled=false;updateCount();fileStatus.textContent=`読込完了：${records.length}地点 ／ 追加POI ${activeAdded().length}件`;setTimeout(()=>map.invalidateSize(),50)}
async function readFile(file){sourceName=file.name.replace(/\.[^.]+$/,'')||'campsite';const lower=file.name.toLowerCase();sourceIsKmz=!lower.endsWith('.kml');if(!sourceIsKmz){sourceZip=null;sourceKmlPath='doc.kml';return file.text()}sourceZip=await JSZip.loadAsync(await file.arrayBuffer());const names=Object.keys(sourceZip.files).filter(n=>n.toLowerCase().endsWith('.kml')&&!sourceZip.files[n].dir);if(!names.length)throw new Error('KMZ内にKMLがありません');sourceKmlPath=names.find(n=>/(^|\/)doc\.kml$/i.test(n))||names[0];return sourceZip.files[sourceKmlPath].async('string')}
fileEl.addEventListener('change',async()=>{const f=fileEl.files?.[0];if(!f)return;fileStatus.textContent='読込中…';try{render(await readFile(f))}catch(e){console.error(e);fileStatus.textContent=`⚠ ${e.message||'読込失敗'}`}});
function circleCoords(lat,lng){const out=[],earth=6378137,lat0=lat*Math.PI/180,lng0=lng*Math.PI/180;for(let i=0;i<=36;i++){const a=i/36*2*Math.PI,pLat=Math.asin(Math.sin(lat0)*Math.cos(RADIUS/earth)+Math.cos(lat0)*Math.sin(RADIUS/earth)*Math.cos(a)),pLng=lng0+Math.atan2(Math.sin(a)*Math.sin(RADIUS/earth)*Math.cos(lat0),Math.cos(RADIUS/earth)-Math.sin(lat0)*Math.sin(pLat));out.push(`${(pLng*180/Math.PI).toFixed(7)},${(pLat*180/Math.PI).toFixed(7)},0`)}return out.join(' ')}function makeEl(xml,name,text){const e=xml.createElementNS(KML_NS,name);if(text!==undefined)e.textContent=text;return e}
function rebuildKml(){const xml=new DOMParser().parseFromString(sourceText,'application/xml'),pms=Array.from(xml.getElementsByTagNameNS('*','Placemark'));for(const r of records){if(r.isNew)continue;const pm=pms[r.sourceIndex];if(!pm)continue;if(r.deleted){pm.remove();continue}if(r.added){const c=pm.getElementsByTagNameNS('*','Point')[0]?.getElementsByTagNameNS('*','coordinates')[0];if(c)c.textContent=`${r.latlng[1].toFixed(7)},${r.latlng[0].toFixed(7)},0`}}
const doc=xml.getElementsByTagNameNS('*','Document')[0]||xml.documentElement;Array.from(xml.getElementsByTagNameNS('*','Folder')).filter(f=>/50m/.test(directText(f,'name'))&&/円/.test(directText(f,'name'))).forEach(f=>f.remove());let addFolder=Array.from(xml.getElementsByTagNameNS('*','Folder')).find(f=>/追加希望POI/.test(directText(f,'name')));if(!addFolder){addFolder=makeEl(xml,'Folder');addFolder.appendChild(makeEl(xml,'name','追加希望POI'));doc.appendChild(addFolder)}for(const r of records.filter(r=>r.isNew&&!r.deleted)){const pm=makeEl(xml,'Placemark');pm.appendChild(makeEl(xml,'name',r.name));if(r.description)pm.appendChild(makeEl(xml,'description',r.description));const pt=makeEl(xml,'Point');pt.appendChild(makeEl(xml,'coordinates',`${r.latlng[1].toFixed(7)},${r.latlng[0].toFixed(7)},0`));pm.appendChild(pt);addFolder.appendChild(pm)}const circleFolder=makeEl(xml,'Folder');circleFolder.appendChild(makeEl(xml,'name','50m円（目安）'));for(const r of records.filter(r=>!r.deleted)){const pm=makeEl(xml,'Placemark');pm.appendChild(makeEl(xml,'name',`${r.name}_50m円`));const poly=makeEl(xml,'Polygon'),outer=makeEl(xml,'outerBoundaryIs'),ring=makeEl(xml,'LinearRing');ring.appendChild(makeEl(xml,'coordinates',circleCoords(r.latlng[0],r.latlng[1])));outer.appendChild(ring);poly.appendChild(outer);pm.appendChild(poly);circleFolder.appendChild(pm)}doc.appendChild(circleFolder);return new XMLSerializer().serializeToString(xml)}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
exportBtn.addEventListener('click',async()=>{if(!sourceText)return;exportBtn.disabled=true;fileStatus.textContent='書き出し中…';try{const kml=rebuildKml();if(sourceIsKmz){const zip=await JSZip.loadAsync(await sourceZip.generateAsync({type:'blob'}));zip.file(sourceKmlPath,kml);downloadBlob(await zip.generateAsync({type:'blob',compression:'DEFLATE'}),`${sourceName}_CREATIVE.kmz`)}else downloadBlob(new Blob([kml],{type:'application/vnd.google-earth.kml+xml'}),`${sourceName}_CREATIVE.kml`);fileStatus.textContent='書き出し完了。距離チェックへ進めます。'}catch(e){console.error(e);fileStatus.textContent=`⚠ 書き出し失敗：${e.message||e}`}finally{exportBtn.disabled=false}});
centerBtn.addEventListener('click',()=>{if(currentPos)map.panTo(currentPos)});if(navigator.geolocation){navigator.geolocation.watchPosition(p=>{currentPos=[p.coords.latitude,p.coords.longitude];centerBtn.disabled=false;updateDistance(currentPos,null)},()=>{}, {enableHighAccuracy:true,maximumAge:5000,timeout:15000})}
</script>
</body>
</html>
