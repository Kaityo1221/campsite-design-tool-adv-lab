<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Campsite Design Tool - 軍議デモ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;color:#e5eef7;background:#050a11}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050a11}body{min-height:100vh;background:radial-gradient(circle at top,#18314d 0,#08111f 48%,#04070d 100%)}button,input{font:inherit}.page{max-width:1220px;margin:0 auto;padding:12px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px;padding:10px 12px;border:1px solid rgba(148,163,184,.24);border-radius:14px;background:rgba(7,17,30,.9)}.title{font-weight:950}.sub{font-size:11px;color:#9fb0c4;margin-top:3px}.filebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input[type=file]{max-width:300px;color:#dbeafe}.scene{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;border-radius:18px;border:1px solid rgba(251,191,36,.28);background-image:url('../prototype/assets/backgrounds/strategy_room_idle.png');background-size:cover;background-position:center;box-shadow:0 22px 70px rgba(0,0,0,.45);isolation:isolate}#map{position:absolute;z-index:2;left:29.3%;top:15.8%;width:40.3%;height:37.2%;background:#101820;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(0,0,0,.55)}#map .leaflet-control-attribution{font-size:7px;background:rgba(255,255,255,.72)}#map .leaflet-control-zoom{transform:scale(.72);transform-origin:top left}#map .leaflet-popup-content{font-size:12px;line-height:1.5;margin:10px 12px}.actor{position:absolute;z-index:12;bottom:-1.5%;width:28%;max-height:61%;object-fit:contain;object-position:bottom;opacity:.30;filter:brightness(.48) saturate(.72);transform:translateY(1.5%) scale(.96);transition:.22s;pointer-events:none;user-select:none}.riku{left:-6.1%}.mina{right:-5%}.actor.active{opacity:1;filter:brightness(1.04) saturate(1.05);transform:translateY(0) scale(1.015)}.speech{position:absolute;z-index:14;left:50%;bottom:-27%;width:82%;height:auto;transform:translateX(-50%);opacity:0;pointer-events:none;user-select:none}.scene[data-speaker="riku"] .speech,.scene[data-speaker="mina"] .speech{opacity:1}.dialog{position:absolute;inset:0;z-index:16;pointer-events:none}.dialogText{position:absolute;top:84.5%;transform:translateY(-50%);white-space:pre-wrap;font-weight:850;line-height:1.16;max-height:3.5em;overflow:hidden}.scene[data-speaker="riku"] .dialogText{left:18%;right:55%;color:#12253d;font-size:clamp(10px,1.05vw,17px)}.scene[data-speaker="mina"] .dialogText{left:55%;right:13%;color:#3d1830;font-size:clamp(10px,1.05vw,17px)}.scene[data-speaker="system"] .dialogText{top:auto;transform:none;left:15%;right:15%;bottom:3.2%;max-height:none;overflow:visible;padding:9px 14px;color:#f8fafc;font-size:clamp(10px,1.1vw,17px);text-align:center;background:linear-gradient(180deg,rgba(4,12,22,.82),rgba(4,12,22,.94));border:1px solid rgba(125,211,252,.48);border-radius:12px}.controls{display:flex;gap:8px;margin-top:10px}.controls button{flex:1;border:0;border-radius:12px;padding:12px 14px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#102033}.controls .secondary{background:#17263a;color:#dbeafe;border:1px solid rgba(148,163,184,.25)}.controls button:disabled{opacity:.36;cursor:not-allowed}.status{margin-top:10px;padding:10px 12px;border-radius:12px;color:#cbd5e1;background:rgba(7,17,30,.78);border:1px solid rgba(148,163,184,.18);font-size:12px;line-height:1.65}.ok{color:#bbf7d0}.warn{color:#fed7aa}.note{font-size:11px;color:#8fa3b9}.hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:760px){.page{padding:0}.top{margin:0;border-radius:0;padding:8px}.title{font-size:13px}.sub{display:none}.filebox{width:100%}input[type=file]{width:100%;max-width:100%;font-size:12px}.scene{border-radius:0;border-left:0;border-right:0;min-height:66vh;aspect-ratio:auto;background-size:auto 100%;background-repeat:no-repeat}.riku{width:52%;max-height:72%;left:-8%;bottom:-2%}.mina{width:43%;max-height:70%;right:-4%;bottom:1%}#map{left:27%;top:15%;width:46%;height:34%}.scene[data-speaker="riku"] .dialogText,.scene[data-speaker="mina"] .dialogText{top:auto;transform:none;height:3.75em;display:flex;align-items:center;overflow:visible;line-height:1.25;font-size:clamp(9px,2.5vw,12px)}.scene[data-speaker="riku"] .dialogText{left:11%;right:52%;bottom:3%;color:#12253d}.scene[data-speaker="mina"] .dialogText{left:55%;right:9%;bottom:4%;color:#3d1830}.scene[data-speaker="system"] .dialogText{left:8%;right:8%;bottom:2%;font-size:clamp(9px,2.6vw,13px)}.controls{padding:0 8px}.controls button{padding:11px 8px;font-size:13px}.status{margin:8px}.speech{bottom:-15%;width:94%}}
</style>
</head>
<body>
<main class="page">
<header class="top"><div><div class="title">⚔️ Campsite Design Tool 軍議デモ</div><div class="sub">完成KMZ / KMLを読み込むと、地図上の特徴からリクとミナが自動で軍議します。</div></div><div class="filebox"><input id="kmzFile" type="file" accept=".kmz,.kml"></div></header>
<section id="scene" class="scene" data-speaker="system"><div id="map"></div><img id="riku" class="actor riku" src="../prototype/assets/characters/riku_normal.png" alt="リク"><img id="mina" class="actor mina" src="../prototype/assets/characters/mina_normal.png" alt="ミナ"><img class="speech" src="../prototype/assets/speech/dialog_riku_left.png" alt=""><div class="dialog"><div id="speaker" class="hidden">SYSTEM</div><div id="dialogText" class="dialogText">KMZまたはKMLを選択すると、自動軍議を開始します。</div></div></section>
<div class="controls"><button id="back" class="secondary" disabled>◀ 戻る</button><button id="next" disabled>次へ ▶</button><button id="restart" class="secondary" disabled>最初から</button></div>
<div id="status" class="status">完成KMZ / KMLを選択してください。<br><span class="note">ファイルはブラウザ内だけで解析し、アップロードしません。</span></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="./gungi-fact-engine.js?v=1"></script>
<script src="./gungi-auto-engine.js?v=1"></script>
<script>
(()=>{'use strict';
const DISTANCE_LIMIT_M=40,DENSE_LIMIT_M=20,STAY_LIMIT_M=30;
const map=L.map('map',{zoomControl:true}).setView([35.6812,139.7671],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const poiLayer=L.layerGroup().addTo(map),highlightLayer=L.layerGroup().addTo(map);
const el={file:document.getElementById('kmzFile'),status:document.getElementById('status'),speaker:document.getElementById('speaker'),dialog:document.getElementById('dialogText'),back:document.getElementById('back'),next:document.getElementById('next'),restart:document.getElementById('restart'),riku:document.getElementById('riku'),mina:document.getElementById('mina'),scene:document.getElementById('scene')};
const RX={added:/(追加|追加希望|希望|新規|候補|add|addition|proposed|candidate|new|cagym|capokestop|capowerspot)/i,existing:/(既存|existing|current)/i,support:/(トイレ|便所|restroom|toilet|水飲|給水|water fountain|休憩|ベンチ|bench|東屋|あずまや|四阿|売店|カフェ|cafe|案内所|information)/i,aux:/(40m|30m|円|buffer|100ft|100feet|100フィート|ダミー)/i};
let points=[],sequence=[],stepIndex=0;
const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
const distanceMeters=(a,b)=>window.GungiFacts.distanceMeters(a,b);
function directChildText(node,tag){const t=Array.from(node.children||[]).find(c=>c.localName===tag||c.tagName===tag);return t?(t.textContent||'').trim():''}
function folderName(pm){let n=pm.parentElement,names=[];while(n){if(n.localName==='Folder'||n.tagName==='Folder'){const x=directChildText(n,'name');if(x)names.unshift(x)}n=n.parentElement}return names.join(' / ')}
function parseKml(text){const xml=new DOMParser().parseFromString(text,'application/xml');if(xml.querySelector('parsererror'))throw new Error('KMLを解析できませんでした。');const out=[];Array.from(xml.getElementsByTagNameNS('*','Placemark')).forEach((pm,i)=>{const p=pm.getElementsByTagNameNS('*','Point')[0],c=p?.getElementsByTagNameNS('*','coordinates')[0];if(!c)return;const first=(c.textContent||'').trim().split(/\s+/)[0],[lngRaw,latRaw]=first.split(','),lat=Number(latRaw),lng=Number(lngRaw);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;const name=(pm.getElementsByTagNameNS('*','name')[0]?.textContent||`POI ${i+1}`).trim(),folder=folderName(pm),source=`${folder} ${name}`,aux=RX.aux.test(folder),isAdded=!aux&&RX.added.test(folder),isExisting=!aux&&RX.existing.test(folder);out.push({id:`p${i+1}`,lat,lng,name,folder,isAdded,isExisting,isTarget:isAdded||isExisting,isSupport:RX.support.test(source)})});return out}
async function readKml(file){const lower=file.name.toLowerCase();if(lower.endsWith('.kml'))return await file.text();if(!lower.endsWith('.kmz'))throw new Error('KMZまたはKMLを選択してください。');const zip=await JSZip.loadAsync(file),files=Object.values(zip.files).filter(e=>!e.dir&&e.name.toLowerCase().endsWith('.kml'));if(!files.length)throw new Error('KMZ内にKMLが見つかりません。');const preferred=files.find(e=>(/(^|\/)doc\.kml$/i).test(e.name))||files[0];return await preferred.async('string')}
function classifyRisk(d){if(d<DENSE_LIMIT_M)return'密集';if(d<STAY_LIMIT_M)return'滞留';if(d<DISTANCE_LIMIT_M)return'軽微';return null}
function distanceWarnings(all){const t=all.filter(p=>p.isTarget),warnings=[];for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++){const a=t[i],b=t[j],d=distanceMeters(a,b);if(d>=DISTANCE_LIMIT_M)continue;warnings.push({a,b,distance:d,type:classifyRisk(d),referenceOnly:a.isExisting&&b.isExisting})}warnings.sort((a,b)=>a.distance-b.distance);return{active:warnings.filter(w=>!w.referenceOnly),reference:warnings.filter(w=>w.referenceOnly)}}
function roles(p){const r=[];if(p?.isAdded)r.push('追加POI');else if(p?.isExisting)r.push('既存POI');if(p?.isSupport)r.push('休憩・利便施設');return r.length?r:['POI']}
function popupHtml(p){return `<strong>${esc(p?.name||'POI')}</strong><br>${esc(roles(p).join(' / '))}${p?.folder?`<br>${esc(p.folder)}`:''}`}
function drawPoints(all){poiLayer.clearLayers();highlightLayer.clearLayers();const bounds=[];all.forEach(p=>{const color=p.isAdded?'#f59e0b':p.isExisting?'#60a5fa':p.isSupport?'#22c55e':'#64748b';L.circleMarker([p.lat,p.lng],{radius:p.isAdded?7:5,color,weight:p.isAdded?3:2,fillColor:color,fillOpacity:p.isTarget?.76:.35,interactive:false}).addTo(poiLayer);bounds.push([p.lat,p.lng])});if(bounds.length)map.fitBounds(bounds,{padding:[30,30],maxZoom:17})}
function focusWarning(w){highlightLayer.clearLayers();map.closePopup();if(!w)return;[w.a,w.b].forEach(p=>L.circleMarker([p.lat,p.lng],{radius:11,color:'#ef4444',weight:4,fillColor:'#fb923c',fillOpacity:.92,interactive:false}).addTo(highlightLayer));L.polyline([[w.a.lat,w.a.lng],[w.b.lat,w.b.lng]],{color:'#ef4444',weight:4,dashArray:'8 6',interactive:false}).bindTooltip(`${w.distance.toFixed(1)}m / ${w.type}`).addTo(highlightLayer);map.fitBounds([[w.a.lat,w.a.lng],[w.b.lat,w.b.lng]],{padding:[90,90],maxZoom:19})}
function focusEvent(event){highlightLayer.clearLayers();map.closePopup();if(!event)return;const palette=event.id==='PARKING_01'||event.id==='NARROW_PATH_01'?['#f59e0b','#fb923c']:event.id==='DENSITY_REST_01'?['#16a34a','#4ade80']:event.id==='LOOP_01'?['#0d9488','#2dd4bf']:['#2563eb','#60a5fa'];const raw=[...(event.matchedPoints||[]),...(event.supportPoints||[])].filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lng)),seen=new Set(),pts=raw.filter(p=>{const k=p.id||`${p.lat},${p.lng},${p.name||''}`;if(seen.has(k))return false;seen.add(k);return true});if(event.id.startsWith('DENSITY')&&event.center)L.circle([event.center.lat,event.center.lng],{radius:100,color:palette[0],weight:3,dashArray:'8 6',fillColor:palette[1],fillOpacity:.12,interactive:false}).addTo(highlightLayer);pts.forEach(p=>{const center=p.id===event.center?.id,m=L.circleMarker([p.lat,p.lng],{radius:center?8:6,color:palette[0],weight:center?4:3,fillColor:p.isSupport?'#22c55e':palette[1],fillOpacity:.92,interactive:true,bubblingMouseEvents:false});m.bindPopup(popupHtml(p),{autoPan:true,closeButton:true});m.addTo(highlightLayer)});if(event.center&&Number.isFinite(event.center.lat))map.flyTo([event.center.lat,event.center.lng],16,{duration:.8});else if(pts.length)map.fitBounds(pts.map(p=>[p.lat,p.lng]),{padding:[80,80],maxZoom:18})}
function warningSequence(w){const d=w.distance,rounded=d.toFixed(1),pairType=`${roles(w.a)[0]} × ${roles(w.b)[0]}`;let riku='',mina='';if(d<DENSE_LIMIT_M){riku=`ここは ${rounded}m。かなり近い。\nまず配置を調整した方がいい。`;mina='魅力は残したいけど、ここは少し離した方が良さそうだね。'}else if(d<STAY_LIMIT_M){riku=`ここは ${rounded}m。30mを切っている。\n滞留の影響を強く見たい。`;mina='じゃあ、どっちかを少し動かして使いやすくしよ！'}else{riku=`ここは ${rounded}m。40mには届いていない。\n調整候補として確認しておこう。`;mina='あとちょっとなら、雰囲気を壊さず調整できそう！'}return[{speaker:'system',text:`距離注意を検出しました。\n${pairType}\n${w.a.name} × ${w.b.name}：${rounded}m（${w.type}）`,warning:w},{speaker:'riku',text:riku},{speaker:'mina',text:mina}]}
function eventSequence(events){const out=[];events.forEach(event=>event.cuts.forEach((cut,i)=>out.push({speaker:cut.speaker,text:cut.text,event:i===0?event:null})));return out}
function buildSequence(warnings,events){const out=[];if(warnings.active.length)out.push(...warningSequence(warnings.active[0]));if(events.length)out.push(...eventSequence(events));if(!out.length)out.push({speaker:'system',text:'大きな距離注意や自動軍議イベントは見つかりませんでした。'},{speaker:'riku',text:'距離条件はよく整理されている。この段階で無理に触る必要はない。'},{speaker:'mina',text:'よしっ！ 次は実際に歩いて楽しいか見てみよう！'});return out}
function setActor(s){el.riku.classList.toggle('active',s==='riku');el.mina.classList.toggle('active',s==='mina');el.scene.dataset.speaker=s;el.speaker.textContent=s==='riku'?'リク':s==='mina'?'ミナ':'SYSTEM'}
function sync(){el.back.disabled=stepIndex<=0;el.next.disabled=stepIndex>=sequence.length-1;el.restart.disabled=!sequence.length}
function renderStep(i){const step=sequence[i];if(!step)return;stepIndex=i;setActor(step.speaker);el.dialog.textContent=step.text;if(step.warning)focusWarning(step.warning);if(step.event)focusEvent(step.event);sync()}
async function handle(file){el.status.textContent='KMZを解析しています…';el.next.disabled=el.back.disabled=el.restart.disabled=true;setActor('system');el.dialog.textContent='地図を読み込んでいます。';const kml=await readKml(file);points=parseKml(kml);if(!points.length)throw new Error('Point形式のPOIを取得できませんでした。');drawPoints(points);const warnings=distanceWarnings(points);const facts=window.GungiFacts.build({points,warnings});const events=window.GungiAutoEvents.detectAll({points,facts});sequence=buildSequence(warnings,events);el.status.innerHTML=`<strong class="ok">✓ ${esc(file.name)} を読み込みました。</strong><br>軍議候補 ${events.length}件 / 距離注意 ${warnings.active.length}件。<br><span class="note">イベントでズームしたPOIはタップできます。</span>`;renderStep(0)}
el.file.addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{await handle(file)}catch(error){console.error(error);points=[];sequence=[];poiLayer.clearLayers();highlightLayer.clearLayers();el.status.innerHTML=`<strong class="warn">⚠ ${esc(error.message||'読み込みに失敗しました。')}</strong>`;setActor('system');el.dialog.textContent='別のKMZ / KMLで試してください。';sync()}});el.back.addEventListener('click',()=>{if(stepIndex>0)renderStep(stepIndex-1)});el.next.addEventListener('click',()=>{if(stepIndex<sequence.length-1)renderStep(stepIndex+1)});el.restart.addEventListener('click',()=>{if(!sequence.length)return;drawPoints(points);renderStep(0)});
})();
</script>
</body>
</html>
