name: Patch PARK_INTRO_01 once

on:
  push:
    branches:
      - feature/park-intro-v0.1
    paths:
      - .github/workflows/park-intro-patch-once.yml
      - tools/patch_park_intro.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/park-intro-v0.1
          fetch-depth: 0

      - name: Apply PARK_INTRO_01 patch
        run: python tools/patch_park_intro.py

      - name: Validate integration
        run: |
          node --check prototype/gungi-park-intro.js
          python - <<'PY'
          from pathlib import Path
          text = Path('prototype/gungi-auto-room.html').read_text(encoding='utf-8')
          required = [
              'gungi-park-intro.js?v=0.1.0',
              'id="parkInfoCard"',
              'GungiParkIntro?.buildSequence',
              'GungiParkIntro?.resolve',
              'initParkIntroPreview',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing PARK_INTRO_01 markers: {missing}')
          print('PARK_INTRO_01 integration markers OK')
          PY

      - name: Commit patched ADV room
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/gungi-auto-room.html
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate PARK_INTRO_01 into ADV startup sequence'
          git push origin HEAD:feature/park-intro-v0.1
