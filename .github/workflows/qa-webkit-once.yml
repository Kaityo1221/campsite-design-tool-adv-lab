name: QA WebKit Once

on:
  push:
    branches:
      - agent/qa-new-poi-label

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creative/runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Run full WebKit suite
        run: npx playwright test
