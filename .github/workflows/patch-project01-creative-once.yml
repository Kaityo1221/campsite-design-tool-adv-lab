name: patch-project01-creative-once

on:
  push:
    paths:
      - '.github/workflows/patch-project01-creative-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch development CREATIVE MODE entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          field = Path('creative/runtime/field-mode.html')
          text = field.read_text(encoding='utf-8')

          entry_links = '''<link rel="stylesheet" href="css/field-mode.css?v=3">\n  <link rel="stylesheet" href="css/field-mode-entry.css?v=dev1">\n  <link rel="stylesheet" href="css/field-mode-entry-position.css?v=dev1">\n  <link rel="stylesheet" href="css/field-mode-entry-transition.css?v=dev1">'''
          if 'field-mode-entry.css?v=dev1' not in text:
              text = text.replace('<link rel="stylesheet" href="css/field-mode.css?v=3">', entry_links)

          text = text.replace('<title>現地モード | Campsite Design Tool JP</title>', '<title>CREATIVE MODE / DEVELOPMENT | Campsite Design Tool</title>')
          text = text.replace('<header class="field-mode-header"><a href="lab.html" class="field-mode-back">← Campsite Lab</a><div><div class="field-mode-eyebrow">FIELD POSITION ADJUSTMENT</div><h1>現地モード</h1></div>', '<header class="field-mode-header"><a href="../../index.html" class="field-mode-back">← Development Hub</a><div><div class="field-mode-eyebrow">CREATIVE MODE / DEVELOPMENT</div><h1>CREATIVE MODE</h1></div>')

          project_script = '<script src="js/project01-development.js?v=1"></script>'
          if project_script not in text:
              text = text.replace('</body></html>', project_script + '\n</body></html>')
          field.write_text(text, encoding='utf-8')

          hub = Path('index.html')
          hub_text = hub.read_text(encoding='utf-8')
          hub_text = hub_text.replace('https://raw.githack.com/Kaityo1221/Campsite-Design-Tool-JP/main/field-mode.html', './creative/runtime/field-mode.html')
          hub_text = hub_text.replace('現行の実CREATIVE MODEへ直接接続します。現地編集・保存・復元を含む実機能です。', '開発版内に複製した実CREATIVE MODEです。PROJECT 01とFREE CREATIVEをここから試せます。')
          hub_text = hub_text.replace('PROJECT 01はCREATIVE MODE側へ統合します。簡易試作ページは入口から外しています。', 'PROJECT 01は開発版CREATIVE MODEへ統合済みです。ADV LABとは完全に分離しています。')
          hub.write_text(hub_text, encoding='utf-8')
          PY

      - name: Add PROJECT 01 tutorial layer
        shell: bash
        run: |
          cat > creative/runtime/js/project01-development.js <<'EOF'
          (()=>{
            'use strict';
            const body=document.body;
            const fileInput=document.getElementById('fieldModeFile');
            if(!body||!fileInput)return;

            const style=document.createElement('style');
            style.textContent=`
              .field-dev-badge{display:inline-block;margin-top:9px;padding:5px 10px;border:1px solid rgba(255,229,155,.58);border-radius:999px;background:rgba(40,32,22,.55);color:#f6d98c;font-size:10px;font-weight:950;letter-spacing:.14em;text-shadow:0 2px 8px #000}
              .field-dev-project-switch{width:min(100%,620px);display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px auto 0}
              .field-dev-project-choice{min-height:52px;border:1px solid rgba(255,239,200,.42);border-radius:16px;background:rgba(43,37,28,.72);color:#fff7e5;font-weight:950;box-shadow:0 8px 20px rgba(0,0,0,.24);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
              .field-dev-project-choice small{display:block;margin-top:3px;font-size:10px;font-weight:750;color:#d8cab0}
              .field-dev-project-choice.is-selected{border-color:#ffe29a;background:linear-gradient(180deg,rgba(119,84,25,.92),rgba(62,44,17,.94));color:#fff0b1;box-shadow:0 0 24px rgba(235,185,61,.48),0 8px 20px rgba(0,0,0,.3)}
              .field-project-hud{position:fixed;z-index:1700;left:10px;right:10px;bottom:calc(74px + env(safe-area-inset-bottom));max-width:560px;margin:auto;padding:10px;border:1px solid rgba(246,217,140,.62);border-radius:18px;background:linear-gradient(180deg,rgba(34,30,24,.94),rgba(20,18,15,.96));color:#fff8e8;box-shadow:0 10px 28px rgba(0,0,0,.36);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
              .field-project-hud-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.field-project-hud-title{font-size:11px;font-weight:950;letter-spacing:.12em;color:#f5d37d}.field-project-progress{padding:4px 8px;border-radius:999px;background:#f1d16f;color:#3c2b0c;font-size:11px;font-weight:950}.field-project-guide{display:grid;grid-template-columns:62px 1fr;gap:9px;align-items:center}.field-project-guide img{width:62px;height:62px;object-fit:contain;border-radius:14px;background:rgba(255,255,255,.07)}.field-project-guide strong{display:block;font-size:13px}.field-project-guide p{margin:3px 0 0;font-size:11px;line-height:1.5;color:#eee1c9}.field-project-actions{display:flex;gap:7px;margin-top:8px}.field-project-actions button{flex:1;min-height:38px;border-radius:11px;border:1px solid #b8954d;background:#d9b65f;color:#34260e;font-weight:950}.field-project-actions button.secondary{background:rgba(255,255,255,.08);color:#fff8e8;border-color:rgba(255,255,255,.22)}
              .field-project-event{margin-top:8px;padding:9px;border:1px solid rgba(255,178,94,.56);border-radius:12px;background:rgba(109,60,18,.42);font-size:11px;line-height:1.5;color:#ffe8bd}.field-project-event strong{color:#ffc76f}
              @media(max-width:420px){.field-dev-project-switch{gap:6px}.field-dev-project-choice{font-size:12px}.field-project-hud{left:7px;right:7px;bottom:calc(68px + env(safe-area-inset-bottom))}.field-project-guide{grid-template-columns:54px 1fr}.field-project-guide img{width:54px;height:54px}}
            `;
            document.head.appendChild(style);

            let mode='project01';
            let projectStep=0;
            let projectTimer=0;
            let lastCount=-1;

            const shell=document.createElement('section');
            shell.id='fieldModeEntryShell';
            shell.className='field-mode-entry-shell';
            shell.innerHTML=`
              <div class="field-mode-entry-inner">
                <div class="field-mode-entry-kicker">CREATIVE MODE</div>
                <p class="field-mode-entry-copy">新しい世界の幕開けへ。</p>
                <div class="field-dev-badge">DEVELOPMENT / 開発版</div>
                <div class="field-dev-project-switch" role="group" aria-label="開始モード">
                  <button id="fieldDevProject01" class="field-dev-project-choice is-selected" type="button">PROJECT 01<small>使える場所を探せ！</small></button>
                  <button id="fieldDevFreeCreative" class="field-dev-project-choice" type="button">FREE CREATIVE<small>自由に設計する</small></button>
                </div>
                <button id="fieldModeEntryStart" class="field-mode-entry-start" type="button" disabled>PROJECT 01をはじめる</button>
                <label class="field-mode-entry-filebar" for="fieldModeFile">
                  <span class="field-mode-entry-fileicon">▱</span>
                  <span><span class="field-mode-entry-filelabel">ゲームスポット元データを選択</span><span id="fieldModeEntryFilename" class="field-mode-entry-filename">未選択</span></span>
                  <span>›</span>
                  <span id="fieldModeEntryFileSlot" class="field-mode-entry-file-slot"></span>
                </label>
                <div id="fieldModeEntryFileState" class="field-mode-entry-file-state"></div>
                <div id="fieldModeEntryHint" class="field-mode-entry-hint">先に設計KMZを選択してください</div>
                <div id="fieldModeEntryResumeSlot" class="field-mode-entry-resume-slot"></div>
                <a class="field-mode-entry-main-link" href="../../index.html">開発版トップへ</a>
                <div class="field-mode-entry-transition">CREATIVE MODE</div>
              </div>`;
            body.appendChild(shell);

            const slot=shell.querySelector('#fieldModeEntryFileSlot');
            slot.appendChild(fileInput);
            const filename=shell.querySelector('#fieldModeEntryFilename');
            const state=shell.querySelector('#fieldModeEntryFileState');
            const hint=shell.querySelector('#fieldModeEntryHint');
            const start=shell.querySelector('#fieldModeEntryStart');
            const projectBtn=shell.querySelector('#fieldDevProject01');
            const freeBtn=shell.querySelector('#fieldDevFreeCreative');
            const resumeSlot=shell.querySelector('#fieldModeEntryResumeSlot');

            const resumePanel=document.getElementById('fieldModeResumePanel');
            const resumeStatus=document.getElementById('fieldModeSessionStatus');
            if(resumePanel)resumeSlot.appendChild(resumePanel);
            if(resumeStatus)resumeSlot.appendChild(resumeStatus);

            function isReady(){try{return !!fileLoaded;}catch(_){return false;}}
            function syncReady(){
              const ready=isReady();
              start.disabled=!ready;
              start.classList.toggle('is-ready',ready);
              if(ready){
                state.textContent='準備OK。元データを読み込みました。';
                hint.textContent=mode==='project01'?'PROJECT 01を開始できます':'自由設計を開始できます';
              }
            }
            function setMode(next){
              mode=next;
              projectBtn.classList.toggle('is-selected',mode==='project01');
              freeBtn.classList.toggle('is-selected',mode==='free');
              start.textContent=mode==='project01'?'PROJECT 01をはじめる':'創作をはじめる';
              syncReady();
            }
            projectBtn.addEventListener('click',()=>setMode('project01'));
            freeBtn.addEventListener('click',()=>setMode('free'));

            fileInput.addEventListener('change',()=>{
              const f=fileInput.files&&fileInput.files[0];
              filename.textContent=f?f.name:'未選択';
              state.textContent=f?`読込中：${f.name}`:'';
              hint.textContent=f?'元データを確認しています…':'先に設計KMZを選択してください';
              let tries=0;
              const timer=setInterval(()=>{tries++;syncReady();if(isReady()||tries>80)clearInterval(timer);},150);
            });

            function newPoiCount(){
              try{return (poiRecords||[]).filter(r=>r&&r.isNew&&!r.fieldDeleted).length;}catch(_){return 0;}
            }
            function projectLine(count){
              if(projectStep===1)return 'いいぞ。候補が見えてきたな。安全性と動線も見ながら、あと少し探そう。';
              if(projectStep>=2)return '状況が変わった。前に良かった場所が今も良いとは限らない。地図を見直してみよう。';
              if(count===0)return 'まずは公園を見て、使えそうな場所を5か所マークしよう。🧰から「POI」を選べば置けるぞ！';
              if(count<3)return `${count}か所目！ いい感じだ。似た場所だけじゃなく、広場・休憩・回遊のバランスも見てみよう。`;
              if(count<5)return `あと${5-count}か所。人が集まっても邪魔になりにくい場所を探してみよう。`;
              return '5か所そろった！ ここから時間を進めて、公園がどう変わるか見てみよう。';
            }
            function renderHud(){
              let hud=document.getElementById('fieldProjectHud');
              if(!hud){
                hud=document.createElement('aside');
                hud.id='fieldProjectHud';
                hud.className='field-project-hud';
                body.appendChild(hud);
              }
              const count=Math.min(5,newPoiCount());
              const event=projectStep===1?'<div class="field-project-event"><strong>📡 6か月後 / 緊急イベント</strong><br>近くにスポンサージムができました！ 周辺の候補地への影響を確認してください。</div>':projectStep>=2?'<div class="field-project-event"><strong>🚉 1年後 / 環境変化</strong><br>駅前の動線が変わり、公園へ入る人の流れが変化しました。候補地をもう一度見直してください。</div>':'';
              const next=(count>=5&&projectStep===0)?'<button id="fieldProjectNextTime" type="button">6か月後へ</button>':projectStep===1?'<button id="fieldProjectNextTime" type="button">1年後へ</button>':projectStep>=2?'<button id="fieldProjectNextTime" type="button">PROJECT完了</button>':'';
              hud.innerHTML=`<div class="field-project-hud-head"><div class="field-project-hud-title">PROJECT 01 / 使える場所を探せ！</div><div class="field-project-progress">${count} / 5</div></div><div class="field-project-guide"><img src="assets/riku_decided.png" alt="リク"><div><strong>リク</strong><p>${projectLine(count)}</p></div></div>${event}${next?`<div class="field-project-actions">${next}<button id="fieldProjectOpenTools" class="secondary" type="button">🧰 道具</button></div>`:''}`;
              hud.querySelector('#fieldProjectOpenTools')?.addEventListener('click',()=>window.FieldCreative?.openMenu?.());
              hud.querySelector('#fieldProjectNextTime')?.addEventListener('click',()=>{
                if(projectStep===0)projectStep=1;
                else if(projectStep===1)projectStep=2;
                else{clearInterval(projectTimer);hud.remove();window.FieldCreative?.exit?.();return;}
                renderHud();
              });
            }
            function startProject01(){
              projectStep=0;
              lastCount=-1;
              window.FieldCreative?.enter?.();
              renderHud();
              clearInterval(projectTimer);
              projectTimer=setInterval(()=>{
                const c=newPoiCount();
                if(c!==lastCount){lastCount=c;renderHud();}
              },450);
            }

            start.addEventListener('click',()=>{
              if(!isReady())return;
              shell.classList.add('is-starting');
              setTimeout(()=>{
                shell.hidden=true;
                body.classList.add('field-mode-entry-started');
                try{map.invalidateSize();}catch(_){}
                if(mode==='project01')startProject01();
                else window.FieldCreative?.enter?.();
              },1500);
            });

            const statusNode=document.getElementById('fieldModeStatus');
            if(statusNode)new MutationObserver(syncReady).observe(statusNode,{childList:true,subtree:true,characterData:true});
            syncReady();
          })();
          EOF

      - name: Commit PROJECT 01 integration
        shell: bash
        run: |
          git config user.name 'Kaityo1221'
          git config user.email 'rakugo100@gmail.com'
          git add index.html creative/runtime/field-mode.html creative/runtime/js/project01-development.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate Project 01 into development CREATIVE MODE'
          git push origin HEAD:main
