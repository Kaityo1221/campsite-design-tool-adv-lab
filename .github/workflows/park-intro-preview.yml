name: Preview PARK_INTRO_01

on:
  push:
    branches:
      - feature/park-intro-v0.1
    paths:
      - prototype/gungi-auto-room.html
      - prototype/gungi-park-intro.js
      - .github/workflows/park-intro-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/prototype/gungi-auto-room.html?demoParkIntro=1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout PARK_INTRO branch
        uses: actions/checkout@v4
        with:
          ref: feature/park-intro-v0.1
          path: preview-src

      - name: Build preview directory
        run: |
          rm -rf site/preview
          mkdir -p site/preview
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            preview-src/ site/preview/
          cat > site/preview/PREVIEW.txt <<'EOF'
          ADV LAB PARK_INTRO_01 development preview
          DEMO query parameter is required to display sample Park Intelligence data without a live AI HTTP endpoint.
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
