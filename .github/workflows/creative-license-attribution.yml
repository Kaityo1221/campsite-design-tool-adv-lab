name: creative-license-attribution

on:
  push:
    branches:
      - agent/creative-license-attribution

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creative-license-attribution

      - name: Match CREATIVE MODE map attribution to Next Lab
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('creative/runtime/creative-design-beta.html')
          s=p.read_text()

          old_css=".leaflet-control-attribution{font-size:9px!important}"
          new_css=".leaflet-control-attribution{font-size:7px!important;line-height:1.1!important;padding:1px 3px!important;background:rgba(255,255,255,.68)!important;color:#555!important;max-width:calc(100vw - 20px)!important;white-space:normal!important}.leaflet-control-attribution a{font-size:inherit!important;color:inherit!important}@media(max-width:520px){.leaflet-control-attribution{font-size:6px!important;max-width:76vw!important}}"
          if s.count(old_css)!=1:
              raise SystemExit(f'attribution css match count={s.count(old_css)}')
          s=s.replace(old_css,new_css,1)

          old_js="const map=L.map('map',{zoomControl:false}).setView([35.6812,139.7671],15);const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap'}).addTo(map);const aerial=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles &copy; Esri'});let aerialMode=false;"
          new_js="const map=L.map('map',{zoomControl:false}).setView([35.6812,139.7671],15);map.attributionControl.setPosition('bottomleft');map.attributionControl.setPrefix(false);const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const aerial=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles &copy; Esri'});let aerialMode=false;"
          if s.count(old_js)!=1:
              raise SystemExit(f'map attribution js match count={s.count(old_js)}')
          s=s.replace(old_js,new_js,1)

          p.write_text(s)
          PY

          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('creative/runtime/creative-design-beta.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not scripts: raise SystemExit('inline script not found')
          Path('/tmp/creative-beta.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/creative-beta.js

          git config user.name "creative-lab-bot"
          git config user.email "creative-lab-bot@users.noreply.github.com"
          git add creative/runtime/creative-design-beta.html
          git commit -m "Show responsive map license in CREATIVE MODE"
          git push origin HEAD:agent/creative-license-attribution
