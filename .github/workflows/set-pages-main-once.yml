name: set-pages-main-once

on:
  push:
    paths:
      - '.github/workflows/set-pages-main-once.yml'

permissions:
  contents: read
  pages: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Point GitHub Pages at main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -f 'source[branch]=main' \
            -f 'source[path]=/'
