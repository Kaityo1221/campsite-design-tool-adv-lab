name: fix-project01-script-once

on:
  push:
    paths:
      - '.github/workflows/fix-project01-script-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inject Project 01 script reliably
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('creative/runtime/field-mode.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="js/project01-development.js?v=2"></script>'
          s = s.replace('<script src="js/project01-development.js?v=1"></script>', '')
          if tag not in s:
              pos = s.lower().rfind('</body>')
              if pos == -1:
                  raise SystemExit('closing body tag not found')
              s = s[:pos] + tag + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "Kaityo1221"
          git config user.email "rakugo100@gmail.com"
          git add creative/runtime/field-mode.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: load Project 01 inside development Creative Mode"
            git push origin main
          fi
