name: Apply PARK_HIGHLIGHT map sync once

on:
  push:
    branches:
      - feature/park-intro-v0.1
    paths:
      - tools/patch_park_highlight_map_sync.py
      - .github/workflows/park-highlight-map-sync-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/patch_park_highlight_map_sync.py
      - name: Validate patched room
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('prototype/gungi-auto-room.html').read_text(encoding='utf-8')
          required = [
              'gungi-park-intro.js?v=0.3.0',
              'focusParkMapPoint',
              'restorePoiMap',
              'park-highlight-pulse',
              'renderMapStep(step)',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing map sync markers: {missing}')
          print('PARK_HIGHLIGHT map sync markers OK')
          PY
      - name: Commit ADV map sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/gungi-auto-room.html
          git commit -m 'Sync Park Story highlights with map focus'
          git push
