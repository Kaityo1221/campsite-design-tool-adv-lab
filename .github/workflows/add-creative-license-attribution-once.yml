name: add-creative-license-attribution-once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add visible map license attribution to CREATIVE MODE
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path('creative/runtime/field-mode.html')
          s = html.read_text()
          old_css = '<link rel="stylesheet" href="css/field-mode.css?v=3">'
          new_css = '<link rel="stylesheet" href="css/field-mode.css?v=4">'
          if s.count(old_css) != 1:
              raise SystemExit(f'field-mode css version match count={s.count(old_css)}')
          s = s.replace(old_css, new_css, 1)

          old_attr = "map.attributionControl.setPosition('bottomleft');"
          new_attr = "map.attributionControl.setPosition('bottomleft');map.attributionControl.setPrefix(false);"
          if s.count(old_attr) != 1:
              raise SystemExit(f'attribution control match count={s.count(old_attr)}')
          s = s.replace(old_attr, new_attr, 1)
          html.write_text(s)

          css = Path('creative/runtime/css/field-mode.css')
          c = css.read_text()
          marker = '/* creative-map-license-attribution-v1 */'
          if marker not in c:
              c += '''\n\n/* creative-map-license-attribution-v1 */\n.field-mode-stage .leaflet-control-attribution {\n  margin: 0 0 1px 1px !important;\n  padding: 1px 3px !important;\n  max-width: calc(100% - 12px) !important;\n  background: rgba(255,255,255,.72) !important;\n  color: #555 !important;\n  font-size: 7px !important;\n  line-height: 1.1 !important;\n  white-space: normal !important;\n  box-shadow: none !important;\n}\n.field-mode-stage .leaflet-control-attribution a {\n  color: inherit !important;\n  font-size: inherit !important;\n}\n@media (max-width: 520px) {\n  .field-mode-stage .leaflet-control-attribution {\n    max-width: 78vw !important;\n    font-size: 6px !important;\n  }\n}\n'''
          css.write_text(c)
          PY

          git config user.name "creative-lab-bot"
          git config user.email "creative-lab-bot@users.noreply.github.com"
          git add creative/runtime/field-mode.html creative/runtime/css/field-mode.css
          git commit -m "Show map license attribution in CREATIVE MODE"
          git push origin HEAD:main
