name: Request ADV LAB Preview

on:
  push:
    branches:
      - agent/dialogue-layout-buffer-20260825

permissions:
  contents: read
  actions: write

jobs:
  request-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch preview deploy from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PREVIEW_REF: ${{ github.ref_name }}
        run: |
          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/preview-adv-lab.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"ref\":\"${PREVIEW_REF}\"}}"
