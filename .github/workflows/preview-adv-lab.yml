name: Preview ADV LAB

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Previewするブランチ名'
        required: true
        default: 'agent/dialogue-layout-buffer-20260825'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: preview-src

      - name: Build preview directory
        run: |
          rm -rf site/preview
          mkdir -p site/preview
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            preview-src/ site/preview/

      - name: Add preview marker
        run: |
          cat > site/preview/PREVIEW.txt <<'EOF'
          ADV LAB development preview
          This directory is generated by Preview ADV LAB workflow.
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
