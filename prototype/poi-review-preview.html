<body>

let round=1;const answers={};
const rounds=document.getElementById('rounds'),cards=document.getElementById('cards'),progress=document.getElementById('progress'),summary=document.getElementById('summary'),summaryBody=document.getElementById('summaryBody');

function renderCards(){cards.innerHTML='';const slice=DATA.slice((round-1)*20,round*20);slice.forEach(([seq,name,hint])=>{const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="num">No.${seq}</div><div class="poi"></div><div class="hint">自動推定（参考）: <b>${esc(hint)}</b></div><div class="choices"></div>`;card.querySelector('.poi').textContent=name;const box=card.querySelector('.choices');CATS.forEach(cat=>{const bt=document.createElement('button');bt.className='choice'+(cat==='保留'?' hold':'')+(answers[seq]===cat?' selected':'');bt.textContent=cat;bt.onclick=()=>{answers[seq]=cat;renderCards()};box.appendChild(bt)});cards.appendChild(card)});const answered=slice.filter(([seq])=>answers[seq]).length;progress.textContent=`第${round}回 / ${answered}・20件回答`}
