<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#101a16" />
  <title>Campsite 未来プレビュー AR | Phase 1</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">CAMPSITE DESIGN TOOL / EXPERIMENT</p>
        <h1>未来プレビュー AR</h1>
      </div>
      <div class="virtual-badge">VIRTUAL PREVIEW</div>
    </header>

    <main class="hud" id="hud">
      <section class="panel setup-panel">
        <div class="panel-title">第一段階</div>
        <p class="lead">完成KMZ / KMLの活動範囲を読み込み、現地カメラ上へ仮想人物を表示します。</p>

        <label class="file-picker">
          <span>1. KMZ / KMLを選ぶ</span>
          <input id="kmzFile" type="file" accept=".kmz,.kml,application/vnd.google-earth.kmz,application/vnd.google-earth.kml+xml" />
        </label>

        <button id="startArBtn" class="primary" type="button" disabled>2. カメラ・位置情報を開始</button>

        <fieldset id="peopleFieldset" disabled>
          <legend>3. 人数</legend>
          <div class="segmented" id="peopleButtons">
            <button type="button" data-count="20">20人</button>
            <button type="button" data-count="50" class="selected">50人</button>
            <button type="button" data-count="100">100人</button>
          </div>
        </fieldset>

        <button id="showFutureBtn" class="future" type="button" disabled>未来を見る</button>

        <div class="status-grid" aria-live="polite">
          <div class="status-row"><span>KMZ</span><strong id="kmzStatus">未読込</strong></div>
          <div class="status-row"><span>AR</span><strong id="arStatus">未開始</strong></div>
          <div class="status-row"><span>GPS</span><strong id="gpsStatus">未取得</strong></div>
        </div>

        <p id="message" class="message">まず完成KMZまたはKMLを選択してください。</p>
      </section>

      <section id="liveCard" class="live-card hidden">
        <div>
          <span class="live-dot"></span>
          <strong id="liveCount">50人規模</strong>
        </div>
        <span id="accuracyText">GPS待機中</span>
      </section>

      <button id="resetBtn" class="reset hidden" type="button">終了して破棄</button>
    </main>

    <div class="watermark" aria-hidden="true">VIRTUAL</div>
    <div class="safety-note">仮想表示です。KMZ・提出データには保存されません。</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
