<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Campsite ADV Lab - KMZ Council</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;color:#e5eef7;background:#07111c}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#050a11}
    body{min-height:100vh;background:radial-gradient(circle at top,#18314d 0,#08111f 48%,#04070d 100%)}
    button,input{font:inherit}
    .page{max-width:1220px;margin:0 auto;padding:16px}
    .labbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;border:1px solid rgba(148,163,184,.24);border-radius:14px;background:rgba(7,17,30,.88);backdrop-filter:blur(12px)}
    .labtitle{font-weight:900;letter-spacing:.03em}.labsub{font-size:12px;color:#9fb0c4;margin-top:3px}.filebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input[type=file]{max-width:290px;color:#dbeafe}.pill{padding:5px 9px;border-radius:999px;background:#10243b;color:#b8cae0;font-size:11px;border:1px solid rgba(125,211,252,.18)}
    .orientation-btn,.focus-btn{border:1px solid rgba(125,211,252,.4);border-radius:999px;padding:7px 11px;background:linear-gradient(135deg,#163354,#0d2138);color:#e0f2fe;font-weight:900;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.22)}
    .orientation-btn.active{background:linear-gradient(135deg,#164e63,#0f766e);border-color:rgba(94,234,212,.65)}
    .focus-btn{background:linear-gradient(135deg,#5b21b6,#312e81);border-color:rgba(196,181,253,.55)}
    .focus-btn:disabled{opacity:.4;cursor:not-allowed}
    .orientation-note{font-size:11px;color:#9fb0c4;width:100%}

    .strategy-scene{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;border-radius:18px;border:1px solid rgba(251,191,36,.28);background-image:url('./assets/backgrounds/strategy_room_idle.png');background-size:cover;background-position:center;box-shadow:0 22px 70px rgba(0,0,0,.45);isolation:isolate}
    .strategy-scene.signal-cut{background-image:url('./assets/backgrounds/strategy_room_signal_cut.png')}
    .strategy-scene::after{content:"";position:absolute;inset:0;z-index:30;pointer-events:none;box-shadow:inset 0 0 90px rgba(0,0,0,.2)}

    #map{position:absolute;z-index:2;left:29.3%;top:15.8%;width:40.3%;height:37.2%;border-radius:2px;background:#101820;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(0,0,0,.55);transition:opacity .25s ease,filter .25s ease}
    .signal-cut #map{opacity:0;filter:blur(2px)}
    #map .leaflet-control-attribution{font-size:7px;background:rgba(255,255,255,.72)}
    #map .leaflet-control-zoom{transform:scale(.72);transform-origin:top left}

    .actor{position:absolute;z-index:12;bottom:-1.5%;width:28%;max-height:61%;object-fit:contain;object-position:bottom;opacity:.30;filter:brightness(.48) saturate(.72);transform:translateY(1.5%) scale(.96);transition:opacity .22s ease,filter .22s ease,transform .22s ease;pointer-events:none;user-select:none}
    .actor-riku{left:-6.1%}.actor-mina{right:-5%}
    .actor.active{opacity:1;filter:brightness(1.04) saturate(1.05);transform:translateY(0) scale(1.015)}
    .signal-cut .actor{opacity:.12;filter:brightness(.25) saturate(.4)}

    .speech-image{
      position:absolute;
      z-index:14;
      left:50%;
      bottom:-27%;
      width:82%;
      height:auto;
      transform:translateX(-50%);
      transform-origin:center bottom;
      opacity:0;
      pointer-events:none;
      user-select:none;
      transition:opacity .16s ease;
    }
    .strategy-scene[data-speaker="riku"] .speech-riku-layout,
    .strategy-scene[data-speaker="mina"] .speech-riku-layout{opacity:1}
    .signal-cut .speech-image{opacity:0!important}

    .dialog-layer{position:absolute;inset:0;z-index:16;pointer-events:none}
    .speaker{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
    .dialog-text{
      position:absolute;
      top:84.5%;
      bottom:auto;
      transform:translateY(-50%);
      white-space:pre-wrap;
      font-weight:800;
      line-height:1.15;
      letter-spacing:.01em;
      text-shadow:none;
      max-height:3.45em;
      overflow:hidden;
    }
    .strategy-scene[data-speaker="riku"] .dialog-text{
      left:18%;
      right:55%;color:#12253d;
      font-size:clamp(10px,1.05vw,17px);
      text-align:left}
    .strategy-scene[data-speaker="mina"] .dialog-text{
      left:53%;
      right:15%;color:#3d1830;
      font-size:clamp(10px,1.05vw,17px);
      text-align:right}
    .strategy-scene[data-speaker="system"] .dialog-text{
      top:auto;transform:none;left:15%;right:15%;bottom:3.2%;max-height:none;overflow:visible;padding:9px 14px;color:#f8fafc;font-size:clamp(10px,1.1vw,17px);text-align:center;background:linear-gradient(180deg,rgba(4,12,22,.82),rgba(4,12,22,.94));border:1px solid rgba(125,211,252,.48);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.34),inset 0 0 20px rgba(56,189,248,.05);text-shadow:0 1px 2px rgba(0,0,0,.55)}
    .signal-cut .dialog-layer{opacity:0}

    .loading-mark{position:absolute;z-index:20;left:50%;top:48%;transform:translate(-50%,-50%);padding:9px 15px;border-radius:999px;color:#f8fafc;font-weight:900;font-size:clamp(10px,1.1vw,15px);letter-spacing:.14em;background:rgba(2,6,12,.78);border:1px solid rgba(255,255,255,.26);opacity:0;transition:opacity .16s ease;pointer-events:none}.signal-cut .loading-mark{opacity:1}
    .controls{display:flex;gap:8px;margin-top:12px}.controls button{flex:1;border:0;border-radius:12px;padding:12px 14px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#102033;box-shadow:0 8px 24px rgba(0,0,0,.2)}.controls button:last-child{background:#17263a;color:#dbeafe;border:1px solid rgba(148,163,184,.25)}.controls button:disabled{opacity:.36;cursor:not-allowed;box-shadow:none}
    .status{margin-top:10px;padding:10px 12px;border-radius:12px;color:#cbd5e1;background:rgba(7,17,30,.78);border:1px solid rgba(148,163,184,.18);font-size:12px;line-height:1.65}.ok{color:#bbf7d0}.warn{color:#fed7aa}
    details.debug{margin-top:8px;border:1px solid rgba(148,163,184,.18);border-radius:12px;background:rgba(7,17,30,.66);color:#cbd5e1}details.debug summary{cursor:pointer;padding:10px 12px;font-size:12px;font-weight:800}.facts{padding:0 12px 12px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.fact{font-size:11px;color:#b8c7d8;padding:8px 9px;border-radius:9px;background:#0b1928;border:1px solid #23364a}
    .rotate-hint{display:none;position:fixed;z-index:900;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(90vw,520px);padding:10px 14px;border-radius:999px;background:rgba(2,8,18,.92);border:1px solid rgba(125,211,252,.45);color:#e0f2fe;font-size:12px;font-weight:800;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}.rotate-hint.show{display:block}
    .focus-exit{display:none;position:fixed;z-index:1002;top:calc(env(safe-area-inset-top) + 10px);right:calc(env(safe-area-inset-right) + 12px);width:34px;height:34px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(0,0,0,.38);color:#fff;font-size:18px;font-weight:800;backdrop-filter:blur(10px);cursor:pointer;opacity:1;transition:opacity .35s ease,transform .2s ease}
    .focus-exit:active{transform:scale(.92)}

    @media(max-width:760px){
      .page{padding:8px}.labbar{padding:8px}.strategy-scene{border-radius:12px}
      .actor{width:29%;max-height:63%;bottom:-1.5%}
      .strategy-scene[data-speaker="riku"] .dialog-text{font-size:clamp(8px,1.85vw,11px)}
      .strategy-scene[data-speaker="mina"] .dialog-text{font-size:clamp(8px,1.85vw,11px)}
      .strategy-scene[data-speaker="system"] .dialog-text{left:13%;right:13%;bottom:2.8%;font-size:clamp(8px,1.9vw,11px);padding:6px 8px}
      .facts{grid-template-columns:1fr 1fr}
    }

    @media(orientation:landscape) and (max-height:700px){
      body:not(.focus-mode){overflow:hidden}
      body:not(.focus-mode) .page{max-width:none;width:100%;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
      body:not(.focus-mode) .labbar{position:fixed;z-index:90;top:6px;right:8px;left:auto;width:auto;margin:0;padding:0;border:0;background:transparent;backdrop-filter:none}
      body:not(.focus-mode) .labbar>div:first-child,body:not(.focus-mode) .labsub,body:not(.focus-mode) .pill,body:not(.focus-mode) .orientation-note,body:not(.focus-mode) input[type=file]{display:none}
      body:not(.focus-mode) .filebox{width:auto;display:flex;gap:5px}
      body:not(.focus-mode) .orientation-btn,body:not(.focus-mode) .focus-btn{padding:5px 9px;font-size:10px;background:rgba(7,17,30,.76)}
      body:not(.focus-mode) .strategy-scene{flex:none;margin:0 auto;border-radius:8px}
      body:not(.focus-mode) .actor{width:26%;max-height:59%}
      body:not(.focus-mode) .strategy-scene[data-speaker="riku"] .dialog-text{font-size:clamp(9px,1.2vw,15px)}
      body:not(.focus-mode) .strategy-scene[data-speaker="mina"] .dialog-text{font-size:clamp(9px,1.2vw,15px)}
      body:not(.focus-mode) .controls{flex:none;height:38px;margin:4px auto 0;gap:6px}
      body:not(.focus-mode) .controls button{padding:4px 10px;font-size:11px;border-radius:9px}
      body:not(.focus-mode) .status,body:not(.focus-mode) details.debug{display:none}
    }

    @media (hover:hover) and (pointer:fine) and (min-width:761px){
      body:not(.focus-mode) .desktop-hover-nav{opacity:.42!important}
      body:not(.focus-mode) .strategy-scene:hover .desktop-hover-nav,
      body:not(.focus-mode) .desktop-hover-nav:focus-within{opacity:1!important}
      body:not(.focus-mode) .desktop-nav-btn{
        background:rgba(4,12,22,.72)!important;
        border-color:rgba(255,255,255,.44)!important;
      }
      body:not(.focus-mode) .desktop-nav-btn:disabled{opacity:.30!important}
    }

    body.focus-mode{overflow:hidden;background:#000;overscroll-behavior:none;touch-action:manipulation}
    body.focus-mode .page{position:fixed;z-index:1000;inset:0;width:100%;max-width:none;height:100%;margin:0;padding:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
    body.focus-mode .labbar,body.focus-mode .status,body.focus-mode details.debug{display:none!important}
    body.focus-mode .strategy-scene{flex:none;margin:0;border:0;border-radius:0;box-shadow:none}
    body.focus-mode .controls{position:fixed;z-index:1002;right:calc(env(safe-area-inset-right) + 16px);bottom:calc(env(safe-area-inset-bottom) + 14px);width:auto!important;height:auto;margin:0;display:flex;gap:8px;opacity:1;transition:opacity .35s ease,transform .35s ease}
    body.focus-mode .controls #nextBtn{flex:none;min-width:102px;padding:9px 16px;border-radius:999px;background:rgba(235,245,255,.82);color:#102033;box-shadow:0 8px 28px rgba(0,0,0,.42);backdrop-filter:blur(12px)}
    body.focus-mode .controls #restartBtn{display:none}
    body.focus-mode .focus-exit{display:block}
    body.focus-mode.focus-ui-hidden .controls,body.focus-mode.focus-ui-hidden .focus-exit{opacity:0;pointer-events:none}
    body.focus-mode .actor{width:26%;max-height:59%}
    body.focus-mode .strategy-scene[data-speaker="riku"] .dialog-text{font-size:clamp(10px,1.25vw,18px)}
    body.focus-mode .strategy-scene[data-speaker="mina"] .dialog-text{font-size:clamp(10px,1.25vw,18px)}
    body.focus-mode .strategy-scene[data-speaker="system"] .dialog-text{bottom:3%;font-size:clamp(10px,1.2vw,17px)}
  </style>
</head>
<body>
  <main class="page">
    <header class="labbar">
      <div><div class="labtitle">🗺️ ADV Lab / 作戦会議 試作</div><div class="labsub">KMZを読み込み、中央モニターの地図を見ながらリクとミナが評価する。</div></div>
      <div class="filebox">
        <input id="kmzFile" type="file">
        <button id="orientationBtn" class="orientation-btn" type="button">↻ 横画面に切替・固定</button>
        <button id="focusBtn" class="focus-btn" type="button" disabled>🎬 集中モード</button>
        <span class="pill">全体図: キャンプサイトPOI</span>
        <div id="orientationNote" class="orientation-note">KMZ読込後は「集中モード」で作戦会議だけに集中できます。</div>
      </div>
    </header>

    <section id="strategyScene" class="strategy-scene" data-speaker="system" aria-label="Campsite Design Tool 作戦会議画面">
      <div id="map" aria-label="KMZ解析地図"></div>
      <img id="actorRiku" class="actor actor-riku" src="./assets/characters/riku_normal.png" alt="リク">
      <img id="actorMina" class="actor actor-mina" src="./assets/characters/mina_normal.png" alt="ミナ">
      <img class="speech-image speech-riku-layout" src="./assets/speech/dialog_riku_left.png" alt="">
      <div class="dialog-layer" id="dialogLayer"><div id="speaker" class="speaker">SYSTEM</div><div id="dialogText" class="dialog-text">KMZまたはKMLを選択すると、作戦会議を開始します。</div></div>
      <div class="loading-mark">ANALYZING MAP...</div>
    </section>

    <div class="controls"><button id="nextBtn" disabled>次へ ▶</button><button id="restartBtn" disabled>作戦会議を最初から</button></div>
    <div id="status" class="status">KMZまたはKMLを選択してください。</div>
    <details class="debug"><summary>解析情報を見る</summary><div id="facts" class="facts"></div></details>
  </main>

  <button id="focusExitBtn" class="focus-exit" type="button" aria-label="集中モードを終了">×</button>
  <div id="rotateHint" class="rotate-hint">📱 端末を横向きにしてください。横向きになると作戦会議画面を広く表示します。</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    const originalTileLayer = L.tileLayer.bind(L);
    L.tileLayer = (url, options) => originalTileLayer(url.replace('{z}/{y}/{x}', '{z}/{x}/{y}'), options);
    const originalFitBounds = L.Map.prototype.fitBounds;
    const originalFlyTo = L.Map.prototype.flyTo;
    L.Map.prototype.fitBounds = function(bounds, options) {
      if (!this.__advOverviewLocked) {
        this.__advOverviewLocked = true;
        const safeOptions = Object.assign({}, options || {}, { padding:[14,14], maxZoom:16, animate:false });
        return originalFitBounds.call(this, bounds, safeOptions);
      }
      return this;
    };
    L.Map.prototype.flyTo = function() {
      if (this.__advOverviewLocked) return this;
      return originalFlyTo.apply(this, arguments);
    };
  </script>
  <script src="./kmz-density-test.js"></script>
  <script>
    (() => {
      const scene=document.getElementById('strategyScene');
      const controls=document.querySelector('.controls');
      const page=document.querySelector('.page');
      const file=document.getElementById('kmzFile');
      const speaker=document.getElementById('speaker');
      const status=document.getElementById('status');
      const orientationBtn=document.getElementById('orientationBtn');
      const focusBtn=document.getElementById('focusBtn');
      const focusExitBtn=document.getElementById('focusExitBtn');
      const nextBtn=document.getElementById('nextBtn');
      const rotateHint=document.getElementById('rotateHint');
      if(!scene||!speaker)return;
      const isLandscape=()=>matchMedia('(orientation: landscape)').matches;
      const visualSize=()=>({width:Math.max(320,Math.floor(window.visualViewport?.width||window.innerWidth)),height:Math.max(220,Math.floor(window.visualViewport?.height||window.innerHeight))});
      const syncSpeaker=()=>{const value=(speaker.textContent||'SYSTEM').trim().toLowerCase();scene.dataset.speaker=value==='リク'?'riku':value==='ミナ'?'mina':'system';};
      new MutationObserver(syncSpeaker).observe(speaker,{childList:true,subtree:true,characterData:true});
      syncSpeaker();
      file?.addEventListener('change',()=>{if(!file.files?.length)return;scene.classList.add('signal-cut')});
      if(status){new MutationObserver(()=>{const text=status.textContent||'';const loaded=text.includes('読み込みました');if(focusBtn)focusBtn.disabled=!loaded;if(loaded||text.includes('失敗')){window.setTimeout(()=>{scene.classList.remove('signal-cut');fitViewport();window.setTimeout(()=>window.dispatchEvent(new Event('resize')),120);},420);}}).observe(status,{childList:true,subtree:true,characterData:true});}
      let locked=false;let uiTimer=null;
      const showRotateHint=()=>{rotateHint?.classList.add('show');window.setTimeout(()=>rotateHint?.classList.remove('show'),3600);};
      const updateOrientationButton=()=>{if(!orientationBtn)return;if(locked){orientationBtn.textContent='🔓 横固定を解除';orientationBtn.classList.add('active');return;}orientationBtn.textContent=isLandscape()?'✓ 横画面':'↻ 横画面に切替・固定';orientationBtn.classList.toggle('active',isLandscape());};
      const scheduleUiHide=()=>{if(!document.body.classList.contains('focus-mode'))return;window.clearTimeout(uiTimer);document.body.classList.remove('focus-ui-hidden');uiTimer=window.setTimeout(()=>document.body.classList.add('focus-ui-hidden'),2400);};
      const revealFocusUi=()=>{if(!document.body.classList.contains('focus-mode'))return;scheduleUiHide();};
      const fitViewport=()=>{updateOrientationButton();const focus=document.body.classList.contains('focus-mode');const {width:vw,height:vh}=visualSize();if(focus){let width;if(isLandscape()){width=Math.floor(Math.min(vw*.88,vh*2.05));}else{width=Math.floor(vw*.96);}width=Math.max(280,width);const height=Math.floor(width/1.5);scene.style.width=`${width}px`;scene.style.height=`${height}px`;scene.style.aspectRatio='auto';if(controls)controls.style.width='auto';if(page)page.style.height=`${vh}px`;window.setTimeout(()=>window.dispatchEvent(new Event('resize')),80);return;}if(!isLandscape()){scene.style.width='';scene.style.height='';scene.style.aspectRatio='';if(controls)controls.style.width='';if(page)page.style.height='';window.setTimeout(()=>window.dispatchEvent(new Event('resize')),80);return;}const reserve=44;const maxW=Math.max(280,vw-8);const maxH=Math.max(180,vh-reserve);const width=Math.floor(Math.min(maxW,maxH*1.5));const height=Math.floor(width/1.5);scene.style.width=`${width}px`;scene.style.height=`${height}px`;scene.style.aspectRatio='auto';if(controls)controls.style.width=`${width}px`;if(page)page.style.height=`${vh}px`;window.setTimeout(()=>window.dispatchEvent(new Event('resize')),80);};
      const requestLandscape=async()=>{let didLock=false;try{if(screen.orientation?.lock){await screen.orientation.lock('landscape');didLock=true}}catch(e){}locked=didLock;if(!didLock&&!isLandscape())showRotateHint();return didLock;};
      orientationBtn?.addEventListener('click',async()=>{if(locked){try{screen.orientation?.unlock?.()}catch(e){}locked=false;fitViewport();return;}await requestLandscape();window.setTimeout(fitViewport,180);});
      const enterFocus=async()=>{document.body.classList.add('focus-mode');document.body.classList.remove('focus-ui-hidden');try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen({navigationUI:'hide'});}}catch(e){}await requestLandscape();window.setTimeout(()=>{fitViewport();scheduleUiHide();},180);};
      const exitFocus=async()=>{window.clearTimeout(uiTimer);document.body.classList.remove('focus-mode','focus-ui-hidden');try{screen.orientation?.unlock?.()}catch(e){}locked=false;try{if(document.fullscreenElement)await document.exitFullscreen?.()}catch(e){}window.setTimeout(fitViewport,160);};
      focusBtn?.addEventListener('click',enterFocus);
      focusExitBtn?.addEventListener('click',event=>{event.stopPropagation();exitFocus()});
      nextBtn?.addEventListener('click',event=>{event.stopPropagation();scheduleUiHide()});
      document.addEventListener('pointerdown',event=>{if(!document.body.classList.contains('focus-mode'))return;if(event.target.closest('button'))return;revealFocusUi();},{passive:true});
      document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('focus-mode')&&document.fullscreenEnabled){window.setTimeout(fitViewport,120);}});
      const refresh=()=>window.setTimeout(fitViewport,80);
      window.addEventListener('orientationchange',()=>window.setTimeout(fitViewport,220));window.addEventListener('resize',refresh,{passive:true});window.visualViewport?.addEventListener('resize',refresh,{passive:true});window.visualViewport?.addEventListener('scroll',refresh,{passive:true});matchMedia('(orientation: landscape)').addEventListener?.('change',refresh);fitViewport();
    })();
  </script>
</body>
</html>
