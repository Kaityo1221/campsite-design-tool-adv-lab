<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Campsite ADV Lab - KMZ Council</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;
      color:#e5eef7;
      background:#07111c;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#18314d 0,#08111f 48%,#04070d 100%)}
    button,input{font:inherit}
    .page{max-width:1220px;margin:0 auto;padding:16px}
    .labbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;border:1px solid rgba(148,163,184,.24);border-radius:14px;background:rgba(7,17,30,.88);backdrop-filter:blur(12px)}
    .labtitle{font-weight:900;letter-spacing:.03em}.labsub{font-size:12px;color:#9fb0c4;margin-top:3px}.filebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input[type=file]{max-width:290px;color:#dbeafe}.pill{padding:5px 9px;border-radius:999px;background:#10243b;color:#b8cae0;font-size:11px;border:1px solid rgba(125,211,252,.18)}
    .orientation-btn{border:1px solid rgba(125,211,252,.4);border-radius:999px;padding:7px 11px;background:linear-gradient(135deg,#163354,#0d2138);color:#e0f2fe;font-weight:900;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.22)}
    .orientation-btn.active{background:linear-gradient(135deg,#164e63,#0f766e);border-color:rgba(94,234,212,.65)}
    .orientation-note{font-size:11px;color:#9fb0c4;width:100%}

    .strategy-scene{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;border-radius:18px;border:1px solid rgba(251,191,36,.28);background-image:url('./assets/backgrounds/strategy_room_idle.png');background-size:cover;background-position:center;box-shadow:0 22px 70px rgba(0,0,0,.45);isolation:isolate}
    .strategy-scene.signal-cut{background-image:url('./assets/backgrounds/strategy_room_signal_cut.png')}
    .strategy-scene::after{content:"";position:absolute;inset:0;z-index:30;pointer-events:none;box-shadow:inset 0 0 90px rgba(0,0,0,.2)}

    #map{position:absolute;z-index:2;left:29.3%;top:15.8%;width:40.3%;height:37.2%;border-radius:2px;background:#101820;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(0,0,0,.55);transition:opacity .25s ease,filter .25s ease}
    .signal-cut #map{opacity:0;filter:blur(2px)}
    #map .leaflet-control-attribution{font-size:7px;background:rgba(255,255,255,.72)}
    #map .leaflet-control-zoom{transform:scale(.72);transform-origin:top left}

    .actor{position:absolute;z-index:14;bottom:-1.5%;width:31%;max-height:66%;object-fit:contain;object-position:bottom;opacity:.30;filter:brightness(.48) saturate(.72);transform:translateY(1.5%) scale(.96);transition:opacity .22s ease,filter .22s ease,transform .22s ease;pointer-events:none;user-select:none}
    .actor-riku{left:-.6%}.actor-mina{right:-.6%}
    .actor.active{opacity:1;filter:brightness(1.04) saturate(1.05);transform:translateY(0) scale(1.035)}
    .signal-cut .actor{opacity:.12;filter:brightness(.25) saturate(.4)}

    .dialog-layer{position:absolute;inset:0;z-index:12;pointer-events:none;background-repeat:no-repeat;transition:opacity .18s ease}
    .strategy-scene[data-speaker="riku"] .dialog-layer{background-image:url('./assets/speech/speech_riku_left.png');background-size:82% auto;background-position:center 118%}
    .strategy-scene[data-speaker="mina"] .dialog-layer{background-image:url('./assets/speech/speech_mina_right.png');background-size:82% auto;background-position:center 118%}
    .speaker{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
    .dialog-text{position:absolute;z-index:16;white-space:pre-wrap;font-weight:800;line-height:1.34;letter-spacing:.01em;text-shadow:none}
    .strategy-scene[data-speaker="riku"] .dialog-text{left:19%;right:15%;top:58.5%;color:#12253d;font-size:clamp(10px,1.05vw,17px)}
    .strategy-scene[data-speaker="mina"] .dialog-text{left:15%;right:19%;top:58.5%;color:#3d1830;font-size:clamp(10px,1.05vw,17px)}
    .strategy-scene[data-speaker="system"] .dialog-layer{background-image:none}
    .strategy-scene[data-speaker="system"] .dialog-text{left:15%;right:15%;bottom:3.2%;top:auto;padding:9px 14px;color:#f8fafc;font-size:clamp(10px,1.1vw,17px);text-align:center;background:linear-gradient(180deg,rgba(4,12,22,.82),rgba(4,12,22,.94));border:1px solid rgba(125,211,252,.48);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.34),inset 0 0 20px rgba(56,189,248,.05);text-shadow:0 1px 2px rgba(0,0,0,.55)}
    .signal-cut .dialog-layer{opacity:0}

    .loading-mark{position:absolute;z-index:20;left:50%;top:48%;transform:translate(-50%,-50%);padding:9px 15px;border-radius:999px;color:#f8fafc;font-weight:900;font-size:clamp(10px,1.1vw,15px);letter-spacing:.14em;background:rgba(2,6,12,.78);border:1px solid rgba(255,255,255,.26);opacity:0;transition:opacity .16s ease;pointer-events:none}.signal-cut .loading-mark{opacity:1}
    .controls{display:flex;gap:8px;margin-top:12px}.controls button{flex:1;border:0;border-radius:12px;padding:12px 14px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#102033;box-shadow:0 8px 24px rgba(0,0,0,.2)}.controls button:last-child{background:#17263a;color:#dbeafe;border:1px solid rgba(148,163,184,.25)}.controls button:disabled{opacity:.36;cursor:not-allowed;box-shadow:none}
    .status{margin-top:10px;padding:10px 12px;border-radius:12px;color:#cbd5e1;background:rgba(7,17,30,.78);border:1px solid rgba(148,163,184,.18);font-size:12px;line-height:1.65}.ok{color:#bbf7d0}.warn{color:#fed7aa}
    details.debug{margin-top:8px;border:1px solid rgba(148,163,184,.18);border-radius:12px;background:rgba(7,17,30,.66);color:#cbd5e1}details.debug summary{cursor:pointer;padding:10px 12px;font-size:12px;font-weight:800}.facts{padding:0 12px 12px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.fact{font-size:11px;color:#b8c7d8;padding:8px 9px;border-radius:9px;background:#0b1928;border:1px solid #23364a}
    .rotate-hint{display:none;position:fixed;z-index:200;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(90vw,520px);padding:10px 14px;border-radius:999px;background:rgba(2,8,18,.92);border:1px solid rgba(125,211,252,.45);color:#e0f2fe;font-size:12px;font-weight:800;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
    .rotate-hint.show{display:block}

    @media(max-width:760px){
      .page{padding:8px}.labbar{padding:8px}.strategy-scene{border-radius:12px}
      .actor{width:32%;max-height:68%;bottom:-1.5%}
      .strategy-scene[data-speaker="riku"] .dialog-layer,.strategy-scene[data-speaker="mina"] .dialog-layer{background-size:84% auto;background-position:center 118%}
      .strategy-scene[data-speaker="riku"] .dialog-text{left:19.5%;right:15.5%;top:59.5%;font-size:clamp(8px,1.85vw,11px);line-height:1.26}
      .strategy-scene[data-speaker="mina"] .dialog-text{left:15.5%;right:19.5%;top:59.5%;font-size:clamp(8px,1.85vw,11px);line-height:1.26}
      .strategy-scene[data-speaker="system"] .dialog-text{left:13%;right:13%;bottom:2.8%;font-size:clamp(8px,1.9vw,11px);padding:6px 8px}
      .facts{grid-template-columns:1fr 1fr}
    }

    /* Landscape: prioritize width. Do not shrink the scene from viewport height. */
    @media(orientation:landscape) and (max-height:620px){
      .page{max-width:none;width:100%;padding:4px 6px}
      .labbar{margin-bottom:4px;padding:4px 6px;gap:4px}
      .labbar>div:first-child{display:none}
      .labsub,.pill,.orientation-note{display:none}
      .filebox{width:100%;justify-content:center;gap:5px}
      input[type=file]{max-width:220px;font-size:11px}
      .orientation-btn{padding:5px 9px;font-size:11px}
      .strategy-scene{width:100%;max-width:none;margin:0;border-radius:8px}
      .controls{width:100%;margin:4px 0 0}
      .controls button{padding:7px 10px;font-size:12px}
      .status,details.debug{display:none}
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="labbar">
      <div><div class="labtitle">🗺️ ADV Lab / 作戦会議 試作</div><div class="labsub">KMZを読み込み、中央モニターの地図を見ながらリクとミナが評価する。</div></div>
      <div class="filebox">
        <input id="kmzFile" type="file">
        <button id="orientationBtn" class="orientation-btn" type="button">↻ 横画面に切替・固定</button>
        <span class="pill">全体図: キャンプサイトPOI</span>
        <div id="orientationNote" class="orientation-note">横画面での閲覧を推奨。ボタンは対応環境では横向き固定を試み、固定できない場合は回転案内を表示します。</div>
      </div>
    </header>

    <section id="strategyScene" class="strategy-scene" data-speaker="system" aria-label="Campsite Design Tool 作戦会議画面">
      <div id="map" aria-label="KMZ解析地図"></div>
      <img id="actorRiku" class="actor actor-riku" src="./assets/characters/riku_normal.png" alt="リク">
      <img id="actorMina" class="actor actor-mina" src="./assets/characters/mina_normal.png" alt="ミナ">
      <div class="dialog-layer" id="dialogLayer"><div id="speaker" class="speaker">SYSTEM</div><div id="dialogText" class="dialog-text">KMZまたはKMLを選択すると、作戦会議を開始します。</div></div>
      <div class="loading-mark">ANALYZING MAP...</div>
    </section>

    <div class="controls"><button id="nextBtn" disabled>次へ ▶</button><button id="restartBtn" disabled>作戦会議を最初から</button></div>
    <div id="status" class="status">KMZまたはKMLを選択してください。</div>
    <details class="debug"><summary>解析情報を見る</summary><div id="facts" class="facts"></div></details>
  </main>
  <div id="rotateHint" class="rotate-hint">📱 端末を横向きにしてください。横向きになると作戦会議画面を広く表示します。</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    const originalTileLayer = L.tileLayer.bind(L);
    L.tileLayer = (url, options) => originalTileLayer(url.replace('{z}/{y}/{x}', '{z}/{x}/{y}'), options);

    const originalFitBounds = L.Map.prototype.fitBounds;
    const originalFlyTo = L.Map.prototype.flyTo;
    L.Map.prototype.fitBounds = function(bounds, options) {
      if (!this.__advOverviewLocked) {
        this.__advOverviewLocked = true;
        const safeOptions = Object.assign({}, options || {}, { padding:[14,14], maxZoom:16, animate:false });
        return originalFitBounds.call(this, bounds, safeOptions);
      }
      return this;
    };
    L.Map.prototype.flyTo = function() {
      if (this.__advOverviewLocked) return this;
      return originalFlyTo.apply(this, arguments);
    };
  </script>
  <script src="./kmz-density-test.js"></script>
  <script>
    (() => {
      const scene=document.getElementById('strategyScene');
      const file=document.getElementById('kmzFile');
      const speaker=document.getElementById('speaker');
      const status=document.getElementById('status');
      const orientationBtn=document.getElementById('orientationBtn');
      const rotateHint=document.getElementById('rotateHint');
      if(!scene||!speaker)return;

      const syncSpeaker=()=>{
        const value=(speaker.textContent||'SYSTEM').trim().toLowerCase();
        scene.dataset.speaker=value==='リク'?'riku':value==='ミナ'?'mina':'system';
      };
      new MutationObserver(syncSpeaker).observe(speaker,{childList:true,subtree:true,characterData:true});
      syncSpeaker();

      file?.addEventListener('change',()=>{if(!file.files?.length)return;scene.classList.add('signal-cut')});
      if(status){
        new MutationObserver(()=>{
          const text=status.textContent||'';
          if(text.includes('読み込みました')||text.includes('失敗')){
            window.setTimeout(()=>{
              scene.classList.remove('signal-cut');
              window.setTimeout(()=>window.dispatchEvent(new Event('resize')),120);
            },420);
          }
        }).observe(status,{childList:true,subtree:true,characterData:true});
      }

      let locked=false;
      const showRotateHint=()=>{
        rotateHint?.classList.add('show');
        window.setTimeout(()=>rotateHint?.classList.remove('show'),3600);
      };
      const updateOrientationButton=()=>{
        if(!orientationBtn)return;
        if(locked){
          orientationBtn.textContent='🔓 横固定を解除';
          orientationBtn.classList.add('active');
          return;
        }
        orientationBtn.textContent=matchMedia('(orientation: landscape)').matches?'✓ 横画面':'↻ 横画面に切替・固定';
        orientationBtn.classList.toggle('active',matchMedia('(orientation: landscape)').matches);
      };

      orientationBtn?.addEventListener('click',async()=>{
        if(locked){
          try{screen.orientation?.unlock?.()}catch(e){}
          try{if(document.fullscreenElement)await document.exitFullscreen?.()}catch(e){}
          locked=false;
          updateOrientationButton();
          return;
        }

        let didLock=false;
        try{
          if(!document.fullscreenElement&&document.documentElement.requestFullscreen){
            await document.documentElement.requestFullscreen();
          }
        }catch(e){}
        try{
          if(screen.orientation?.lock){
            await screen.orientation.lock('landscape');
            didLock=true;
          }
        }catch(e){}

        locked=didLock;
        updateOrientationButton();
        if(!didLock&&!matchMedia('(orientation: landscape)').matches)showRotateHint();
        window.setTimeout(()=>window.dispatchEvent(new Event('resize')),180);
      });

      window.addEventListener('orientationchange',()=>window.setTimeout(()=>{
        updateOrientationButton();
        window.dispatchEvent(new Event('resize'));
      },180));
      matchMedia('(orientation: landscape)').addEventListener?.('change',()=>{
        updateOrientationButton();
        window.setTimeout(()=>window.dispatchEvent(new Event('resize')),120);
      });
      updateOrientationButton();
    })();
  </script>
</body>
</html>
