<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADV Dialogue Engine V2 Test</title>
<style>
body{margin:0;padding:20px;background:#08111d;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}main{max-width:900px;margin:auto}.card{background:#101d2c;border:1px solid #2e4660;border-radius:18px;padding:18px;margin-bottom:14px}h1{font-size:22px;margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;color:#aac0d6;margin-bottom:6px}select,button{width:100%;min-height:46px;border-radius:12px;border:1px solid #45627f;background:#172a3d;color:#fff;padding:10px;font:inherit}button{margin-top:10px;font-weight:900;cursor:pointer;background:#234c74}.line{padding:12px 0;border-top:1px solid #24394f}.line:first-child{border-top:0}.speaker{font-size:11px;font-weight:900;color:#8fcfff}.text{margin-top:5px;font-size:16px;line-height:1.65}.meta{font-size:11px;color:#90a4b8;line-height:1.7}.count{font-weight:900;color:#b7f7c4}.scenario{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:999px;background:#203e5d;color:#bce2ff;font-size:11px;font-weight:900}.tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}.tag{padding:3px 7px;border-radius:999px;background:#17283a;color:#a8bfd5;font-size:10px}.hint{margin-top:8px;padding:10px;border-radius:10px;background:#0b1724;color:#b7c9db;font-size:11px;line-height:1.6}@media(max-width:640px){body{padding:10px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="card">
<h1>ADV Dialogue Engine V2</h1>
<div class="meta">固定・監修済みセリフだけを使用し、イベント単体ではなく「周囲のイベント」「進行位置」「解析強度」を組み合わせて話し方を変えるテスト画面です。自由生成AIは使用しません。</div>
<div id="engineInfo" class="meta"></div>
</div>
<div class="card">
<div class="grid">
<div><label for="eventId">主イベント</label><select id="eventId"></select></div>
<div><label for="preset">周囲の状況</label><select id="preset">
<option value="single">単体イベント</option>
<option value="gateway">入口＋交通＋ランドマーク</option>
<option value="crowdLoop">密集＋回遊＋休憩</option>
<option value="narrowWater">狭路＋水辺＋密集</option>
<option value="commercial">商業＋飲食＋交通</option>
<option value="family">遊具＋広場＋休憩</option>
<option value="tourist">観光＋ランドマーク＋交通＋密集</option>
<option value="favorable">複合好条件＋回遊＋休憩＋交通＋ランドマーク＋観光</option>
</select></div>
<div><label for="phase">軍議の進行</label><select id="phase">
<option value="early">序盤</option><option value="middle">中盤</option><option value="late">終盤</option>
</select></div>
<div><label for="strength">解析強度</label><select id="strength">
<option value="normal">通常</option><option value="strong">強いシグナル</option>
</select></div>
</div>
<button id="generate">別の言い回しを見る</button>
<div class="hint">イベントを変えたあと、周囲の状況も変えてみてください。同じ入口でも「駅から来る入口」「密集している入口」などでセリフが切り替わります。</div>
</div>
<div id="output" class="card"></div>
</main>
<script src="./gungi-dialogues-v0.3.js"></script>
<script src="./gungi-dialogue-engine-v1.js"></script>
<script src="./gungi-dialogue-engine-v2.js"></script>
<script>
(() => {
  const dialogues=window.GUNGI_DIALOGUES_V03||{};
  const engine=window.GungiDialogueEngineV2;
  const eventSelect=document.getElementById('eventId');
  const presetSelect=document.getElementById('preset');
  const phaseSelect=document.getElementById('phase');
  const strengthSelect=document.getElementById('strength');
  const out=document.getElementById('output');
  const ids=Object.keys(dialogues).filter(id=>/^[A-Z0-9_]+$/.test(id));
  ids.forEach(id=>{const o=document.createElement('option');o.value=id;o.textContent=id;eventSelect.appendChild(o);});

  const PRESETS={
    single:[],
    gateway:['ENTRANCE_01','TRANSIT_01','LANDMARK_CLUSTER_01'],
    crowdLoop:['DENSITY_01','DENSITY_REST_01','LOOP_01','REST_01'],
    narrowWater:['NARROW_PATH_01','WATER_01','DENSITY_01'],
    commercial:['COMMERCIAL_CLUSTER_01','FOOD_SUPPLY_01','TRANSIT_01'],
    family:['PLAYGROUND_01','PARK_PLAZA_01','REST_01'],
    tourist:['TOURIST_CLUSTER_01','LANDMARK_CLUSTER_01','TRANSIT_01','DENSITY_01'],
    favorable:['FAVORABLE_COMPOSITE_01','LOOP_01','REST_01','TRANSIT_01','LANDMARK_CLUSTER_01','TOURIST_CLUSTER_01']
  };

  document.getElementById('engineInfo').innerHTML=`Engine: ${engine?.version||'not loaded'} / V1追加: <span class="count">${engine?.inheritedBankSize||0}</span> / 状況別: <span class="count">${engine?.scenarioLineCount||0}</span> / 合計監修セリフ: <span class="count">${engine?.totalCuratedLines||0}</span> / シチュエーション: <span class="count">${engine?.scenarioCount||0}</span>`;

  function metricsFor(id,strong){
    const m={count:strong?12:5,matchedCount:strong?8:3,category:'landmark'};
    if(id==='DENSITY_01'||id==='DENSITY_REST_01'){m.nearbyExistingCount=strong?12:7;m.supportCount=strong?3:1;}
    if(id==='ATTRIBUTE_SKEW_01')m.ratio=strong?.78:.58;
    if(id==='FAVORABLE_COMPOSITE_01')m.favorableConditions=strong?6:4;
    return m;
  }

  function contextFor(eventId){
    const around=[...(PRESETS[presetSelect.value]||[])];
    if(!around.includes(eventId))around.push(eventId);
    const total=Math.max(around.length,6);
    const phase=phaseSelect.value;
    const eventIndex=phase==='early'?0:phase==='middle'?Math.floor(total/2):total-1;
    return {eventIds:around,eventIndex,eventTotal:total};
  }

  function render(){
    const id=eventSelect.value;
    const strong=strengthSelect.value==='strong';
    const event={id,title:id,confidence:strong?'high':'medium',metrics:metricsFor(id,strong)};
    const base=dialogues[id];
    const context=contextFor(id);
    const resolved=engine.resolve(event,base,context);
    const cuts=resolved?.cuts||[];
    const meta=resolved?.dialogueMeta||{};
    const tags=meta.tags||[];
    out.innerHTML=cuts.map(c=>`<div class="line"><div class="speaker">${c.speaker}</div><div class="text">${String(c.text||'').replaceAll('{category}','ランドマーク')}</div></div>`).join('')+
      `<div class="scenario">scenario: ${meta.scenario||'V1 fallback'}</div>`+
      `<div class="tags">${tags.map(tag=>`<span class="tag">${tag}</span>`).join('')}</div>`+
      `<div class="meta">eventIds: ${context.eventIds.join(' / ')}</div>`;
  }

  [eventSelect,presetSelect,phaseSelect,strengthSelect].forEach(el=>el.addEventListener('change',()=>{engine.reset();render();}));
  document.getElementById('generate').addEventListener('click',render);
  engine.reset();render();
})();
</script>
</body>
</html>
