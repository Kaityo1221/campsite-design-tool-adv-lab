<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>ADV 自動軍議イベント判定テスト</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;color:#e8eef7;background:#07111c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#17324d 0,#08111f 46%,#04070d 100%)}main{max-width:980px;margin:0 auto;padding:18px}.card{margin-bottom:14px;padding:16px;border:1px solid rgba(148,163,184,.22);border-radius:16px;background:rgba(7,17,30,.86)}h1,h2,p{margin-top:0}.sub{color:#a9b9cb;line-height:1.65}.status{margin-top:10px;padding:10px 12px;border-radius:10px;background:#0c1c2d;color:#cbd5e1;line-height:1.6}.primary{padding:16px;border-radius:14px;background:linear-gradient(135deg,rgba(30,64,175,.22),rgba(14,116,144,.18));border:1px solid rgba(125,211,252,.3)}.id{font-size:12px;letter-spacing:.12em;color:#93c5fd;font-weight:900}.title{font-size:24px;font-weight:950;margin:4px 0 8px}.reason{color:#d5e4f3;line-height:1.6}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{padding:5px 8px;border-radius:999px;background:#10243a;color:#cfe2f5;font-size:11px}.events,.story{display:grid;gap:8px}.event-row,.beat{padding:11px 12px;border-radius:11px;background:#0b1928;border:1px solid #24394d}.small{font-size:12px;color:#aebed0;line-height:1.55}.file{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:8px}.fact{padding:8px;border-radius:9px;background:#0b1928;color:#b7c8da;font-size:11px;border:1px solid #22384c}@media(max-width:640px){main{padding:10px}.facts{grid-template-columns:1fr}.title{font-size:20px}}
  </style>
</head>
<body><main>
<section class="card"><div class="id">CAMPSITE DESIGN TOOL / ADV LAB</div><h1>自動軍議イベント判定 v0.2.0</h1><p class="sub">実KMZ / KMLから24イベントの発火候補を抽出します。セリフは未確定のまま、判定とストーリー骨格を先行検証します。</p><div class="file"><input id="file" type="file" accept=".kmz,.kml"><span>KMZ / KML</span></div><div id="status" class="status">ファイルを選択してください。</div></section>
<section class="card"><h2>最優先イベント</h2><div id="primary" class="primary">まだ判定していません。</div></section>
<section class="card"><h2>ストーリー骨格</h2><div id="story" class="story"><div class="small">イベントを検出すると表示されます。</div></div></section>
<section class="card"><h2>検出イベント一覧</h2><div id="events" class="events"><div class="small">まだ判定していません。</div></div></section>
<section class="card"><details open><summary>解析Facts</summary><div id="facts" class="facts"></div></details></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="./gungi-auto-engine.js?v=0.2.0"></script>
<script>
(()=>{'use strict';const fileEl=document.getElementById('file'),statusEl=document.getElementById('status'),primaryEl=document.getElementById('primary'),eventsEl=document.getElementById('events'),storyEl=document.getElementById('story'),factsEl=document.getElementById('facts');
const RX={added:/(追加|追加希望|希望|新規|候補|add|addition|proposed|candidate|new|cagym|capokestop|capowerspot)/i,existing:/(既存|existing|current)/i,support:/(トイレ|便所|restroom|toilet|水飲|給水|water fountain|休憩|ベンチ|bench|東屋|あずまや|四阿|売店|カフェ|cafe|案内所|information)/i,auxiliary:/(50m|40m|30m|円|buffer|100ft|100feet|100フィート|ダミー)/i};
const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
function directChildText(node,tag){const t=Array.from(node.children||[]).find(c=>c.localName===tag||c.tagName===tag);return t?(t.textContent||'').trim():'';}function nearestFolderName(pm){let n=pm.parentElement,names=[];while(n){if(n.localName==='Folder'||n.tagName==='Folder'){const name=directChildText(n,'name');if(name)names.unshift(name);}n=n.parentElement;}return names.join(' / ');}function parseKml(text){const xml=new DOMParser().parseFromString(text,'application/xml');if(xml.querySelector('parsererror'))throw new Error('KMLを解析できませんでした。');const result=[];Array.from(xml.getElementsByTagNameNS('*','Placemark')).forEach((pm,index)=>{const p=pm.getElementsByTagNameNS('*','Point')[0],c=p?.getElementsByTagNameNS('*','coordinates')[0];if(!c)return;const [lngRaw,latRaw]=(c.textContent||'').trim().split(/\s+/)[0].split(','),lat=Number(latRaw),lng=Number(lngRaw);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;const name=(pm.getElementsByTagNameNS('*','name')[0]?.textContent||`POI ${index+1}`).trim(),folder=nearestFolderName(pm),source=`${folder} ${name}`,aux=RX.auxiliary.test(folder);result.push({id:`p${index+1}`,lat,lng,name,folder,isAdded:!aux&&RX.added.test(folder),isExisting:!aux&&RX.existing.test(folder),isSupport:RX.support.test(source)});});return result;}
async function readKml(file){const lower=file.name.toLowerCase();if(lower.endsWith('.kml'))return await file.text();if(!lower.endsWith('.kmz'))throw new Error('KMZまたはKMLを選択してください。');const zip=await JSZip.loadAsync(file),c=Object.values(zip.files).filter(e=>!e.dir&&e.name.toLowerCase().endsWith('.kml'));if(!c.length)throw new Error('KMZ内にKMLが見つかりません。');return await (c.find(e=>/(^|\/)doc\.kml$/i.test(e.name))||c[0]).async('string');}
function render(points,events){const primary=events[0]||null;if(!primary){primaryEl.innerHTML='<div class="title">発火なし</div><div class="reason">24イベントの条件に一致する候補は見つかりませんでした。</div>';eventsEl.innerHTML='<div class="small">検出イベントなし。</div>';storyEl.innerHTML='<div class="small">ストーリー骨格なし。</div>';}else{primaryEl.innerHTML=`<div class="id">${esc(primary.id)}</div><div class="title">${esc(primary.title)}</div><div class="reason">${esc(primary.reason)}</div><div class="meta"><span class="chip">${esc(primary.type)}</span><span class="chip">confidence: ${esc(primary.confidence)}</span><span class="chip">priority: ${primary.priority}</span></div>`;storyEl.innerHTML=(primary.story||[]).map((beat,i)=>`<div class="beat"><strong>${i+1}.</strong> ${esc(beat)}</div>`).join('');eventsEl.innerHTML=events.map((e,i)=>`<div class="event-row"><strong>${i+1}. ${esc(e.id)} / ${esc(e.title)}</strong><div class="small">${esc(e.reason)} / priority ${e.priority}</div></div>`).join('');}
const added=points.filter(p=>p.isAdded).length,existing=points.filter(p=>p.isExisting).length,support=points.filter(p=>p.isSupport).length;factsEl.innerHTML=[`Point POI: ${points.length}件`,`追加POI候補: ${added}件`,`既存POI: ${existing}件`,`休憩・支援候補: ${support}件`,`検出イベント: ${events.length}件`,`登録イベント: ${window.GungiAutoEvents?.constants?.eventCount||'?'}`,`エンジン: ${window.GungiAutoEvents?.version||'unknown'}`].map(t=>`<div class="fact">${esc(t)}</div>`).join('');}
fileEl.addEventListener('change',async()=>{const file=fileEl.files?.[0];if(!file)return;statusEl.textContent='解析中…';try{const points=parseKml(await readKml(file));if(!points.length)throw new Error('Point形式のPOIを取得できませんでした。');const events=window.GungiAutoEvents.detectAll({points});render(points,events);statusEl.innerHTML=`✓ 解析完了 ${esc(file.name)} / ${points.length} POI / ${events.length} events`;}catch(error){console.error(error);statusEl.textContent=`⚠ ${error.message||'解析に失敗しました。'}`;}});})();
</script></body></html>
