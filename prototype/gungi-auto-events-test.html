<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ADV 24イベント判定テスト</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;color:#e8eef7;background:#07111c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#17324d 0,#08111f 46%,#04070d 100%)}main{max-width:980px;margin:auto;padding:18px}.card{margin-bottom:14px;padding:16px;border:1px solid #26394d;border-radius:16px;background:#07111ee8}h1,h2,p{margin-top:0}.sub,.small{color:#a9b9cb;line-height:1.65}.status,.event,.beat,.fact{padding:10px 12px;border-radius:10px;background:#0c1c2d;margin-top:8px}.primary{padding:16px;border-radius:14px;background:#10243a}.id{font-size:12px;letter-spacing:.12em;color:#93c5fd;font-weight:900}.title{font-size:24px;font-weight:950;margin:4px 0 8px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{padding:5px 8px;border-radius:999px;background:#172f49;font-size:11px}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}@media(max-width:640px){main{padding:10px}.facts{grid-template-columns:1fr}}</style>
</head><body><main>
<section class="card"><div class="id">CAMPSITE DESIGN TOOL / ADV LAB</div><h1>24イベント判定 v0.2.2</h1><p class="sub">活動範囲ポリゴンがKMZ/KMLに含まれる場合は、その内側のPOIだけで24イベントを判定します。セリフはまだ入れず、判定とストーリー骨格だけ確認します。</p><input id="file" type="file" accept=".kmz,.kml"><div id="status" class="status">ファイルを選択してください。</div></section>
<section class="card"><h2>最優先イベント</h2><div id="primary" class="primary">まだ判定していません。</div></section>
<section class="card"><h2>ストーリー骨格</h2><div id="story" class="small">イベントを検出すると表示されます。</div></section>
<section class="card"><h2>検出イベント一覧</h2><div id="events" class="small">まだ判定していません。</div></section>
<section class="card"><h2>解析Facts</h2><div id="facts" class="facts"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="./gungi-auto-engine.js?v=0.2.2"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),fileEl=$('file'),statusEl=$('status'),primaryEl=$('primary'),storyEl=$('story'),eventsEl=$('events'),factsEl=$('facts');const RX={added:/(追加|追加希望|希望|新規|候補|add|addition|proposed|candidate|new|cagym|capokestop|capowerspot)/i,existing:/(既存|existing|current)/i,aux:/(50m|40m|30m|円|buffer|100ft|100feet|100フィート|ダミー)/i,activity:/(活動範囲|活動エリア|活動区域|対象範囲|対象エリア|activity\s*(area|range)|event\s*area)/i};const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
function direct(node,tag){const t=Array.from(node.children||[]).find(c=>c.localName===tag||c.tagName===tag);return t?(t.textContent||'').trim():''}function folder(pm){let n=pm.parentElement,a=[];while(n){if(n.localName==='Folder'||n.tagName==='Folder'){const x=direct(n,'name');if(x)a.unshift(x)}n=n.parentElement}return a.join(' / ')}
function polygonCoords(pm){const node=pm.getElementsByTagNameNS('*','Polygon')[0]?.getElementsByTagNameNS('*','coordinates')[0];if(!node)return null;const coords=(node.textContent||'').trim().split(/\s+/).map(raw=>{const [lngRaw,latRaw]=raw.split(','),lat=Number(latRaw),lng=Number(lngRaw);return Number.isFinite(lat)&&Number.isFinite(lng)?{lat,lng}:null}).filter(Boolean);return coords.length>=3?coords:null}
function parse(text){const xml=new DOMParser().parseFromString(text,'application/xml');if(xml.querySelector('parsererror'))throw Error('KMLを解析できませんでした。');const out=[];let activityPolygon=null;Array.from(xml.getElementsByTagNameNS('*','Placemark')).forEach((pm,i)=>{const name=(pm.getElementsByTagNameNS('*','name')[0]?.textContent||`POI ${i+1}`).trim(),f=folder(pm),label=`${f} ${name}`.trim();const polygon=polygonCoords(pm);if(polygon&&RX.activity.test(label)&&!RX.aux.test(label)&&!activityPolygon)activityPolygon=polygon;const c=pm.getElementsByTagNameNS('*','Point')[0]?.getElementsByTagNameNS('*','coordinates')[0];if(!c)return;const [lngRaw,latRaw]=(c.textContent||'').trim().split(/\s+/)[0].split(','),lat=Number(latRaw),lng=Number(lngRaw);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;const aux=RX.aux.test(f);out.push({id:`p${i+1}`,lat,lng,name,folder:f,isAdded:!aux&&RX.added.test(f),isExisting:!aux&&RX.existing.test(f)})});return {points:out,activityPolygon}}
async function read(file){if(file.name.toLowerCase().endsWith('.kml'))return file.text();if(!file.name.toLowerCase().endsWith('.kmz'))throw Error('KMZまたはKMLを選択してください。');const z=await JSZip.loadAsync(file),fs=Object.values(z.files).filter(e=>!e.dir&&e.name.toLowerCase().endsWith('.kml'));if(!fs.length)throw Error('KMZ内にKMLがありません。');return (fs.find(e=>/(^|\/)doc\.kml$/i.test(e.name))||fs[0]).async('string')}
function render(allPoints,scopedPoints,events,hasScope){const p=events[0];if(!p){primaryEl.innerHTML='<div class="title">発火なし</div>';storyEl.textContent='ストーリー骨格なし。';eventsEl.textContent='検出イベントなし。'}else{primaryEl.innerHTML=`<div class="id">${esc(p.id)}</div><div class="title">${esc(p.title)}</div><div>${esc(p.reason)}</div><div class="meta"><span class="chip">${esc(p.type)}</span><span class="chip">priority ${p.priority}</span></div>`;storyEl.innerHTML=(p.story||[]).map((x,i)=>`<div class="beat"><b>${i+1}.</b> ${esc(x)}</div>`).join('');eventsEl.innerHTML=events.map((e,i)=>`<div class="event"><b>${i+1}. ${esc(e.title)}</b><div class="small">${esc(e.reason)} / ${esc(e.id)}</div></div>`).join('')}factsEl.innerHTML=[`全Point POI: ${allPoints.length}件`,`判定対象POI: ${scopedPoints.length}件`,`活動範囲: ${hasScope?'検出・適用':'未検出（全Point対象）'}`,`追加POI: ${scopedPoints.filter(x=>x.isAdded).length}件`,`既存POI: ${scopedPoints.filter(x=>x.isExisting).length}件`,`検出イベント: ${events.length}件`,`登録イベント: ${Object.keys(window.GungiAutoEvents?.eventDefs||{}).length}件`,`エンジン: ${window.GungiAutoEvents?.version||'unknown'}`].map(x=>`<div class="fact">${esc(x)}</div>`).join('')}
fileEl.addEventListener('change',async()=>{const f=fileEl.files?.[0];if(!f)return;statusEl.textContent='解析中…';try{const parsed=parse(await read(f));const scoped=parsed.activityPolygon?window.GungiAutoEvents.scopePoints(parsed.points.map((p,i)=>({...p,id:p.id||`p${i+1}`})),{activityPolygon:parsed.activityPolygon}):parsed.points;const events=window.GungiAutoEvents.detectAll({points:parsed.points,activityPolygon:parsed.activityPolygon});render(parsed.points,scoped,events,!!parsed.activityPolygon);statusEl.textContent=`✓ ${f.name} / ${parsed.points.length} POI → 判定対象 ${scoped.length} / ${events.length} events${parsed.activityPolygon?' / 活動範囲適用':''}`}catch(e){console.error(e);statusEl.textContent=`⚠ ${e.message||'解析失敗'}`}})})();
</script></body></html>
